<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate V.A.N.I-xAI Premium</title>
    <link rel="shortcut icon" href="vani_icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: url('activation_bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .activation-container {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; /* hidden until auth checks out */
        }

        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .user-profile img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-primary);
        }

        .user-info {
            text-align: left;
        }

        .user-info h3 {
            margin: 0;
            font-size: 1.1rem;
            color: #fff;
        }

        .user-info p {
            margin: 2px 0 0;
            font-size: 0.9rem;
            color: var(--saffron);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-family: 'Outfit';
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn-activate {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            font-weight: 700;
            font-family: 'Outfit';
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-activate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }
        
        /* Error Modal */
        .error-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 3000; display: none; justify-content: center; align-items: center;
        }
        .error-modal-content {
            background: rgba(15, 23, 42, 0.95); border: 1px solid #ef4444; border-radius: 20px;
            padding: 30px; text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .error-modal-content i { color: #ef4444; font-size: 3.5rem; margin-bottom: 15px; }
        .error-modal-content h3 { color: #fff; margin: 0 0 10px; font-size: 1.5rem; }
        .error-modal-content p { color: #94a3b8; margin: 0; font-size: 0.95rem; line-height: 1.5; }

        .loader {
            display: block;
            margin: 50px auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .not-requested {
            text-align: center;
            padding: 40px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Error Modal -->
    <div class="error-modal" id="errorModal">
        <div class="error-modal-content">
            <i class="fa-solid fa-circle-xmark"></i>
            <h3>Invalid Activation Key</h3>
            <p>Please enter the correct Activation Key provided by the admin.</p>
        </div>
    </div>

    <div class="loader" id="pageLoader"></div>

    <div class="not-requested" id="notRequested">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 4rem; color: var(--saffron); margin-bottom: 20px;"></i>
        <h2>No Premium Request Found</h2>
        <p style="color: #94a3b8; margin-bottom: 20px;">You must submit a premium verification request before you can activate a key.</p>
        <button class="btn-activate" onclick="window.location.href='/premium.html'" style="width: auto; padding: 10px 20px;">Go to Premium Plans</button>
    </div>

    <div class="activation-container" id="activationContainer">
        <img src="vani_logo.jpg" alt="V.A.N.I-xAI" class="logo-img">
        <h2>Activate Premium</h2>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px;">Enter the activation key provided by the Admin.</p>

        <div class="user-profile">
            <img src="developer.png" id="userAvatar" alt="User">
            <div class="user-info">
                <h3 id="userEmail">Loading...</h3>
                <p id="vaniId">ID: Loading...</p>
            </div>
        </div>

        <div class="form-group">
            <label>Activation Key</label>
            <input type="text" id="activationKeyInput" placeholder="V.A.N.I-xAI-STARTER-ABCD-1234" required>
        </div>

        <button class="btn-activate" id="btnActivate">Activate Subscription</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAUsbCzU-CfBGDIm1xqLMDaq5uzjWorvE",
            authDomain: "vani-nzdrsr.firebaseapp.com",
            projectId: "vani-nzdrsr",
            storageBucket: "vani-nzdrsr.firebasestorage.app",
            messagingSenderId: "908306821780",
            appId: "1:908306821780:web:02e878153145968d113a81"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userData = null;

        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                
                try {
                    // Fetch user details for UI
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if(userDoc.exists) {
                        userData = userDoc.data();
                        
                        // Self-heal: Generate VANI ID if missing
                        let displayVaniId = userData.vaniId;
                        if (!displayVaniId) {
                            const nameBase = (user.displayName || user.email.split('@')[0]).replace(/[^a-zA-Z]/g, '').substring(0, 4).toUpperCase();
                            const randomDigits = Math.floor(1000 + Math.random() * 9000);
                            displayVaniId = `V.A.N.I-xAI-${nameBase}-${randomDigits}`;
                            await db.collection('users').doc(user.uid).update({ vaniId: displayVaniId });
                        }

                        document.getElementById('userEmail').innerText = user.email;
                        document.getElementById('vaniId').innerText = 'ID: ' + displayVaniId;
                        if(userData.photoURL) {
                            document.getElementById('userAvatar').src = userData.photoURL;
                        }
                    }

                    // Check if user has requested premium
                    const requestQuery = await db.collection('premium_requests')
                                                 .where('userId', '==', user.uid)
                                                 .get();

                    document.getElementById('pageLoader').style.display = 'none';

                    if (requestQuery.empty) {
                        document.getElementById('notRequested').style.display = 'block';
                    } else {
                        document.getElementById('activationContainer').style.display = 'block';
                    }

                } catch(error) {
                    console.error("Error loading activation data:", error);
                    alert("Error loading page.");
                }
            } else {
                window.location.href = '/auth-vani-xai.html';
            }
        });

        // Activation Logic
        document.getElementById('btnActivate').addEventListener('click', async () => {
            const keyInput = document.getElementById('activationKeyInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btnActivate = document.getElementById('btnActivate');

            errorMsg.style.display = 'none';

            if(!keyInput) {
                errorMsg.innerText = "Please enter an activation key.";
                errorMsg.style.display = 'block';
                return;
            }

            btnActivate.disabled = true;
            btnActivate.innerText = "Verifying...";

            try {
                // Fetch the key
                const keyDoc = await db.collection('activation_keys').doc(keyInput).get();

                if (!keyDoc.exists) {
                    throw new Error("Invalid Activation Key.");
                }

                const keyData = keyDoc.data();

                if (keyData.isUsed) {
                    throw new Error("This Activation Key has already been used.");
                }

                if (keyData.userId !== currentUser.uid) {
                    throw new Error("This Activation Key was not issued to your account.");
                }

                // If valid, calculate new expiry date based on requested months
                const now = new Date();
                const expiryDate = new Date(now.setMonth(now.getMonth() + keyData.months));

                // 1. Mark key as used
                await db.collection('activation_keys').doc(keyInput).update({
                    isUsed: true,
                    usedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 2. Upgrade user
                await db.collection('users').doc(currentUser.uid).update({
                    isPremium: true,
                    premiumExpiry: expiryDate
                });

                alert("Congratulations! Your Premium subscription has been successfully activated.");
                window.location.href = '/settings.html';

            } catch(error) {
                const modal = document.getElementById('errorModal');
                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 6000);

                btnActivate.disabled = false;
                btnActivate.innerText = "Activate Subscription";
            }
        });
    </script>
</body>
</html>
