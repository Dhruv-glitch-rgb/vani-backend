<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Unlimited Plan Active - VANI-xAI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #020617;
            --surface-color: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-indigo: #6366f1;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color) url('inxv_bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .activation-container {
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.15);
        }

        .logo-img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #34d399, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            color: #34d399;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            text-align: left;
        }

        .user-profile img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
        }

        .user-info h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .user-info p {
            margin: 3px 0 0 0;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .unlocked-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .unlocked-list li {
            font-size: 0.95rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .unlocked-list li i {
            color: #34d399;
        }

        .btn-launch {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.35);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
            color: #fff;
        }

        .btn-secondary {
            display: block;
            margin-top: 15px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .btn-secondary:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="activation-container">
        <img src="vani_logo.jpg" alt="V.A.N.I-xAI" class="logo-img">
        <h2>Free Unlimited Plan</h2>
        <div class="status-badge"><i class="fa-solid fa-infinity"></i> 100% Free Forever</div>

        <div class="user-profile">
            <img src="developer.png" id="userAvatar" alt="User">
            <div class="user-info">
                <h3 id="userEmail">Loading User...</h3>
                <p id="vaniId">ID: Loading...</p>
            </div>
        </div>

        <ul class="unlocked-list">
            <li><i class="fa-solid fa-circle-check"></i> Unlimited Queries &amp; NLP Chat</li>
            <li><i class="fa-solid fa-circle-check"></i> Full Real-Time Voice Agent Access</li>
            <li><i class="fa-solid fa-circle-check"></i> Zero-Tab Saras.WebSearch Enabled</li>
            <li><i class="fa-solid fa-circle-check"></i> Multi-Device Swarm &amp; Clipboard Sync</li>
        </ul>

        <a href="/index.html?launch=true" class="btn-launch">
            <i class="fa-solid fa-terminal"></i> Launch Workspace Console
        </a>
        <a href="/settings.html" class="btn-secondary">
            Go to Settings
        </a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAUsbCzU-CfBGDIm1xqLMDaq5uzjWorvE",
            authDomain: "vani-nzdrsr.firebaseapp.com",
            projectId: "vani-nzdrsr",
            storageBucket: "vani-nzdrsr.firebasestorage.app",
            messagingSenderId: "908306821780",
            appId: "1:908306821780:web:02e878153145968d113a81"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(async user => {
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    let displayVaniId = '';
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        displayVaniId = userData.vaniId;
                        if(userData.photoURL) {
                            document.getElementById('userAvatar').src = userData.photoURL;
                        }
                    }
                    if (!displayVaniId) {
                        const nameBase = (user.displayName || user.email.split('@')[0]).replace(/[^a-zA-Z]/g, '').substring(0, 4).toUpperCase();
                        const randomDigits = Math.floor(1000 + Math.random() * 9000);
                        displayVaniId = `V.A.N.I-xAI-${nameBase}-${randomDigits}`;
                        await db.collection('users').doc(user.uid).update({ vaniId: displayVaniId, isPremium: true });
                    }

                    document.getElementById('userEmail').innerText = user.displayName || user.email;
                    document.getElementById('vaniId').innerText = 'ID: ' + displayVaniId;
                } catch(e) {
                    console.error("Error loading user profile:", e);
                }
            } else {
                window.location.href = '/auth-vani-xai.html';
            }
        });
    </script>
</body>
</html>
