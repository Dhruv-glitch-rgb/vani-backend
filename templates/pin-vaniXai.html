<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security PIN - V.A.N.I-xAI</title>
    <link rel="shortcut icon" href="vani_icon.png" type="image/x-icon">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <style>
        :root {
            --accent-primary: #0284c7;
            --accent-secondary: #7c3aed;
            --accent-pink: #ec4899;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --error-color: #ef4444;
            --success-color: #10b981;
            --text-main: #0f172a;
            --text-dim: #475569;
        }

        body.light-theme {
            background: #f8faff !important;
            color: #0f172a !important;
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Colorful Floating Mesh Blobs */
        .ambient-core {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.42;
            animation: floatGlow 14s infinite alternate ease-in-out;
        }
        .pin-glow-1 { top: -10%; left: -8%; width: 500px; height: 500px; background: radial-gradient(circle, #fcd34d 0%, rgba(245, 158, 11, 0.4) 45%, transparent 70%); }
        .pin-glow-2 { top: 10%; right: -8%; width: 520px; height: 520px; background: radial-gradient(circle, #38bdf8 0%, rgba(2, 132, 199, 0.4) 45%, transparent 70%); animation-delay: -3.5s; }
        .pin-glow-3 { bottom: -10%; left: 10%; width: 540px; height: 540px; background: radial-gradient(circle, #f472b6 0%, rgba(236, 72, 153, 0.35) 45%, transparent 70%); animation-delay: -7s; }
        .pin-glow-4 { bottom: 5%; right: 10%; width: 480px; height: 480px; background: radial-gradient(circle, #34d399 0%, rgba(16, 185, 129, 0.35) 45%, transparent 70%); animation-delay: -10s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, 25px) scale(1.08); }
            100% { transform: translate(-30px, -20px) scale(0.95); }
        }

        /* Grid */
        .texture-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(14, 165, 233, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
        }

        /* Glass Container Override */
        .pin-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            padding: 44px 36px 36px;
            text-align: center;
            background: rgba(255, 255, 255, 0.88) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(124, 58, 237, 0.12), 0 0 35px rgba(14, 165, 233, 0.18), 0 10px 30px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        .pin-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3.5px;
            background: linear-gradient(90deg, #f43f5e, #ec4899, #a855f7, #3b82f6, #06b6d4, #10b981, #f59e0b);
            background-size: 200% 100%;
            animation: rainbowBar 4s linear infinite;
        }

        @keyframes rainbowBar {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        @keyframes slideUpFade {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Header */
        .auth-logo {
            width: 76px;
            margin-bottom: 16px;
            border-radius: 20px;
            border: 2px solid rgba(2, 132, 199, 0.4);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.25), 0 0 15px rgba(236, 72, 153, 0.2);
            background: #ffffff;
            padding: 4px;
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #0284c7 0%, #7c3aed 50%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            color: #475569;
            font-size: 0.92rem;
            margin-bottom: 24px;
            font-weight: 500;
        }

        /* PIN Display Area */
        .pin-display {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 26px;
            min-height: 22px;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: #f1f5f9;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pin-dot.filled {
            background: linear-gradient(135deg, #0284c7 0%, #ec4899 100%);
            border-color: #0284c7;
            box-shadow: 0 0 14px rgba(2, 132, 199, 0.55), 0 0 8px rgba(236, 72, 153, 0.4);
            transform: scale(1.15);
        }
        
        .pin-dot.error {
            background: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Invisible Input for Desktop Keyboard */
        #hidden-pin-input {
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
        }

        /* Interactive NumPad (Mobile Only) */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-content: center;
        }

        /* Hide NumPad on Desktop */
        @media (min-width: 769px) {
            .numpad {
                display: none;
            }
            .pin-container::after {
                content: "Please use your keyboard to enter the PIN";
                display: block;
                margin-top: 20px;
                color: #64748b;
                font-size: 0.82rem;
                font-family: 'Space Grotesk', sans-serif;
                font-weight: 500;
            }
        }

        .num-btn {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            color: #0f172a;
            font-size: 1.5rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            cursor: pointer;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
        }

        .num-btn:hover {
            transform: translateY(-2px);
            border-color: #0284c7;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.2);
            color: #0284c7;
        }

        .num-btn:active, .num-btn.active {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.15), rgba(236, 72, 153, 0.15));
            border-color: #0284c7;
            box-shadow: 0 0 16px rgba(2, 132, 199, 0.35);
            transform: scale(0.95);
        }
        
        .num-btn.action {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            font-size: 1.25rem;
            color: #64748b;
        }
        .num-btn.action:hover {
            border-color: #ec4899;
            color: #ec4899;
        }

        .msg-text {
            margin-top: 18px;
            min-height: 20px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #0284c7;
        }
        
        .msg-error {
            color: #e11d48;
        }

        .loading-spinner {
            display: none;
            margin: 20px auto;
            width: 34px; height: 34px;
            border: 3px solid rgba(2, 132, 199, 0.15);
            border-top: 3px solid #0284c7;
            border-right: 3px solid #ec4899;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body class="light-theme" style="height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; margin: 0;">

    <div class="ambient-core pin-glow-1"></div>
    <div class="ambient-core pin-glow-2"></div>
    <div class="ambient-core pin-glow-3"></div>
    <div class="ambient-core pin-glow-4"></div>
    <div class="texture-grid"></div>

    <div class="pin-container glass-panel">
        <img src="vani_logo.jpg" class="auth-logo" alt="V.A.N.I-xAI">
        <h2 id="pin-title">Security Gateway</h2>
        <p class="subtitle" id="pin-subtitle">Authenticating session...</p>
        
        <div class="loading-spinner" id="loading-spinner"></div>

        <!-- Length Selection Area -->
        <div id="length-selection-area" style="display: none; margin-bottom: 20px;">
            <p style="margin-bottom: 15px; color: var(--accent-primary);">Choose PIN Length:</p>
            <div style="display: flex; justify-content: center; gap: 15px;">
                <button class="num-btn" style="font-size:1.2rem; width: 60px; height:60px;" onclick="selectPinLength(4)">4</button>
                <button class="num-btn" style="font-size:1.2rem; width: 60px; height:60px;" onclick="selectPinLength(6)">6</button>
                <button class="num-btn" style="font-size:1.2rem; width: 60px; height:60px;" onclick="selectPinLength(8)">8</button>
            </div>
        </div>

        <div id="pin-interaction-area" style="display: none;">
            <!-- PIN Dots -->
            <div class="pin-display" id="pin-dots">
                <!-- Dots will be generated via JS based on expected length -->
            </div>

            <!-- Hidden input to capture keyboard events on Desktop -->
            <input type="password" id="hidden-pin-input" inputmode="numeric" pattern="[0-9]*">

            <!-- Mobile NumPad -->
            <div class="numpad" id="numpad">
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
                <button class="num-btn action" id="btn-clear"><i class="fa-solid fa-xmark"></i></button>
                <button class="num-btn" data-num="0">0</button>
                <button class="num-btn action" id="btn-backspace"><i class="fa-solid fa-delete-left"></i></button>
            </div>

            <div class="msg-text" id="status-msg"></div>

            <div style="margin-top: 18px;">
                <button id="btn-signout-pin" onclick="signOutFromPinPage()" style="background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(244, 63, 94, 0.15)); color: #e11d48; border: 1.2px solid rgba(244, 63, 94, 0.35); padding: 9px 20px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.25s;" title="Sign Out of this account">
                    <i class="fa-solid fa-right-from-bracket"></i> Sign Out / Switch Account
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAUsbCzU-CfBGDIm1xqLMDaq5uzjWorvE",
            authDomain: "vani-nzdrsr.firebaseapp.com",
            projectId: "vani-nzdrsr",
            storageBucket: "vani-nzdrsr.firebasestorage.app",
            messagingSenderId: "908306821780",
            appId: "1:908306821780:web:02e878153145968d113a81"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // UI Elements
        const titleEl = document.getElementById('pin-title');
        const subtitleEl = document.getElementById('pin-subtitle');
        const spinner = document.getElementById('loading-spinner');
        const interactionArea = document.getElementById('pin-interaction-area');
        const dotsContainer = document.getElementById('pin-dots');
        const statusMsg = document.getElementById('status-msg');
        const hiddenInput = document.getElementById('hidden-pin-input');
        
        let mode = 'check'; // 'check', 'setup', 'verify', 'reset_verify'
        let currentUser = null;
        let expectedPin = null;
        let currentPin = '';
        let maxPinLength = 8; // Default max
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');

        function signOutFromPinPage() {
            if (confirm("Are you sure you want to sign out?")) {
                auth.signOut().then(() => {
                    localStorage.removeItem('vani_session_token');
                    window.location.href = '/auth-vani-xai.html';
                }).catch(() => {
                    window.location.href = '/auth-vani-xai.html';
                });
            }
        }

        // Show/Hide Loading
        function setLoading(isLoading) {
            spinner.style.display = isLoading ? 'block' : 'none';
            interactionArea.style.display = isLoading ? 'none' : 'block';
            if(!isLoading && !isLockedOut) hiddenInput.focus();
        }
        
        let failedAttempts = 0;
        let isLockedOut = false;
        let lockoutTimerInterval = null;

        function startLockoutTimer(lockoutUntilDate) {
            isLockedOut = true;
            setLoading(false);
            interactionArea.style.display = 'block';
            dotsContainer.style.display = 'none';
            document.getElementById('numpad').style.display = 'none';
            hiddenInput.disabled = true;
            
            clearInterval(lockoutTimerInterval);
            
            const updateTimer = () => {
                const now = new Date();
                const diffMs = lockoutUntilDate - now;
                if (diffMs <= 0) {
                    clearInterval(lockoutTimerInterval);
                    isLockedOut = false;
                    dotsContainer.style.display = 'flex';
                    document.getElementById('numpad').style.display = 'grid';
                    hiddenInput.disabled = false;
                    statusMsg.textContent = 'You may try again.';
                    statusMsg.className = 'msg-text';
                    currentPin = '';
                    updateDots();
                    hiddenInput.focus();
                } else {
                    const secondsLeft = Math.ceil(diffMs / 1000);
                    statusMsg.textContent = `Too many incorrect attempts. Try again in ${secondsLeft}s.`;
                    statusMsg.className = 'msg-text msg-error';
                }
            };
            
            updateTimer();
            lockoutTimerInterval = setInterval(updateTimer, 1000);
        }

        // Draw Dots
        function drawDots(length) {
            dotsContainer.innerHTML = '';
            for(let i=0; i<length; i++) {
                const dot = document.createElement('div');
                dot.className = 'pin-dot';
                dotsContainer.appendChild(dot);
            }
        }

        // Update Dots UI based on input
        function updateDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('filled');
                    dot.classList.remove('error');
                } else {
                    dot.classList.remove('filled', 'error');
                }
            });
            hiddenInput.value = currentPin; // keep hidden input in sync

            // Auto-submit logic based on mode
            if (mode === 'setup') {
                if (currentPin.length === 4 || currentPin.length === 6 || currentPin.length === 8) {
                    statusMsg.innerHTML = 'Press <b>Enter</b> to confirm, or continue typing.';
                    statusMsg.className = 'msg-text';
                } else {
                    statusMsg.innerHTML = '';
                }
            } else if (mode === 'verify' || mode === 'reset_verify') {
                if (currentPin.length === expectedPin.length) {
                    verifyPin();
                }
            }
        }

        function triggerError() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach(dot => dot.classList.add('error'));
            setTimeout(() => {
                currentPin = '';
                updateDots();
            }, 500);
        }

        // --- Logic Handlers ---

        async function logActivity(msg) {
            try {
                await db.collection('logs').add({
                    activity: msg,
                    email: currentUser.email || 'Unknown',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch(e) { console.error("Logging error:", e); }
        }

        async function verifyPin() {
            if (currentPin === expectedPin) {
                if (mode === 'reset_verify') {
                    // Start Setup Mode
                    mode = 'setup';
                    currentPin = '';
                    hiddenInput.value = '';
                    statusMsg.textContent = '';
                    interactionArea.style.display = 'none';
                } else {
                    statusMsg.textContent = "Access Granted.";
                    statusMsg.className = 'msg-text';
                    sessionStorage.setItem('pin_verified', 'true');
                    
                    // Reset failed attempts on success
                    if (failedAttempts > 0) {
                        db.collection('users').doc(currentUser.uid).update({ failedAttempts: 0, lockoutUntil: firebase.firestore.FieldValue.delete() }).catch(console.error);
                    }

                    await logActivity("Security PIN Verified");
                    setTimeout(() => window.location.href = './login-loading-vaniXai.html', 500);
                }
            } else {
                failedAttempts++;
                statusMsg.textContent = "Incorrect PIN.";
                statusMsg.className = 'msg-text msg-error';
                
                try {
                    let lockoutDuration = 0;
                    if (failedAttempts === 2) lockoutDuration = 10000;
                    else if (failedAttempts >= 3) lockoutDuration = 40000;

                    let updateData = { failedAttempts: failedAttempts };
                    
                    if (lockoutDuration > 0) {
                        const lockoutUntil = new Date(Date.now() + lockoutDuration);
                        updateData.lockoutUntil = lockoutUntil;
                        await db.collection('users').doc(currentUser.uid).update(updateData);
                        startLockoutTimer(lockoutUntil);
                    } else {
                        await db.collection('users').doc(currentUser.uid).update(updateData);
                        triggerError();
                    }
                } catch(e) {
                    console.error("Error updating failed attempts", e);
                    triggerError();
                }
            }
        }

        async function savePin() {
            if (currentPin.length !== 4 && currentPin.length !== 6 && currentPin.length !== 8) {
                statusMsg.textContent = "PIN must be exactly 4, 6, or 8 digits.";
                statusMsg.className = 'msg-text msg-error';
                triggerError();
                return;
            }

            setLoading(true);
            try {
                await db.collection('users').doc(currentUser.uid).set({
                    email: currentUser.email,
                    name: currentUser.displayName || currentUser.email.split('@')[0],
                    pin: currentPin,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                statusMsg.textContent = "Security PIN configured successfully.";
                sessionStorage.setItem('pin_verified', 'true');
                await logActivity("Security PIN Configured");
                setTimeout(() => window.location.href = './login-loading-vaniXai.html', 500);
            } catch (err) {
                console.error(err);
                statusMsg.textContent = "Error saving PIN. Please try again.";
                setLoading(false);
            }
        }

        // --- Event Listeners ---

        // Screen Keyboard / Buttons
        document.querySelectorAll('.num-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if(btn.dataset.num) {
                    if (currentPin.length < maxPinLength) {
                        currentPin += btn.dataset.num;
                        updateDots();
                    }
                }
            });
        });

        document.getElementById('btn-backspace').addEventListener('click', () => {
            currentPin = currentPin.slice(0, -1);
            updateDots();
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            currentPin = '';
            updateDots();
        });

        // Desktop Physical Keyboard via Hidden Input
        hiddenInput.addEventListener('input', (e) => {
            const val = e.target.value.replace(/[^0-9]/g, '');
            currentPin = val.slice(0, maxPinLength);
            updateDots();
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (mode === 'setup') {
                    savePin();
                } else if (mode === 'verify' || mode === 'reset_verify') {
                    if (currentPin.length > 0) verifyPin();
                }
            }
        });

        // Force focus on click anywhere
        document.addEventListener('click', () => {
            if (interactionArea.style.display !== 'none') {
                hiddenInput.focus();
            }
        });

        const lengthSelectionArea = document.getElementById('length-selection-area');

        function selectPinLength(len) {
            maxPinLength = len;
            lengthSelectionArea.style.display = 'none';
            interactionArea.style.display = 'block';
            titleEl.textContent = action === 'reset' ? 'Create New PIN' : 'Create Security PIN';
            subtitleEl.innerHTML = `Set your <b>${len}</b> digit security PIN`;
            drawDots(len);
            hiddenInput.focus();
        }

        // --- Main Auth Flow ---
        
        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                setLoading(true);
                
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        const data = doc.data();
                        const idName = data.name ? encodeURIComponent(data.name.replace(/ /g, '-')) : 'User';
                        
                        // Check if banned
                        if (data.status === 'banned') {
                            window.location.href = `/${idName}/banned-by-vani-xai0419`;
                            return;
                        }
                        
                        // Check if blocked
                        if (data.status === 'blocked' && data.unblockTime) {
                            const unblockDate = data.unblockTime.toDate();
                            if (unblockDate > new Date()) {
                                window.location.href = `/${idName}/blocked-by-vani-xai0419`;
                                return;
                            } else {
                                // Block expired, reset status
                                await db.collection('users').doc(user.uid).update({ status: firebase.firestore.FieldValue.delete(), unblockTime: firebase.firestore.FieldValue.delete(), blockReason: firebase.firestore.FieldValue.delete() });
                            }
                        }

                        if (data.pin) {
                            expectedPin = doc.data().pin;
                            maxPinLength = expectedPin.length;

                            if (action === 'reset') {
                                // User wants to reset -> Reset Verify Mode
                                mode = 'reset_verify';
                                titleEl.textContent = 'Reset Security PIN';
                                subtitleEl.textContent = 'Enter your CURRENT PIN to verify identity';
                                drawDots(maxPinLength);
                                setLoading(false);
                                interactionArea.style.display = 'block';
                                hiddenInput.focus();
                            } else {
                                // Normal Login -> Verify Mode
                                mode = 'verify';
                                titleEl.textContent = 'Enter Security PIN';
                                subtitleEl.textContent = 'Please verify your identity to continue';
                                
                                const data = doc.data();
                                failedAttempts = data.failedAttempts || 0;
                                
                                if (data.lockoutUntil) {
                                    const lockoutUntil = data.lockoutUntil.toDate();
                                    if (lockoutUntil > new Date()) {
                                        startLockoutTimer(lockoutUntil);
                                        drawDots(maxPinLength);
                                        return; // Don't allow input yet
                                    }
                                }
                                
                                drawDots(maxPinLength);
                                setLoading(false);
                                interactionArea.style.display = 'block';
                                hiddenInput.focus();
                            }
                        }
                    }
                    
                    if (!doc.exists || !doc.data().pin) {
                        // User has no PIN -> Setup Mode (Show Length Selection First)
                        mode = 'setup';
                        titleEl.textContent = 'Setup Security PIN';
                        subtitleEl.innerHTML = 'First, select how long you want your PIN to be.';
                        setLoading(false);
                        interactionArea.style.display = 'none';
                        lengthSelectionArea.style.display = 'block';
                    }
                } catch (error) {
                    console.error("Firestore error:", error);
                    subtitleEl.textContent = "Database connection error.";
                }
            } else {
                window.location.href = '/auth-vani-xai.html';
            }
        });

    </script>

<!-- Dark Mode Toggle Snippet -->
<style>
  .dark-mode-toggle-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: var(--accent-indigo, #FF9933);
    color: white;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.3s, transform 0.2s;
  }
  .dark-mode-toggle-btn:hover {
    transform: scale(1.1);
  }
  /* Dark mode overrides */
  body.dark-mode {
    --bg-main: #0f172a;
    --panel-bg: rgba(30, 41, 59, 0.85);
    --panel-border: rgba(255, 255, 255, 0.1);
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #64748b;
    background-color: var(--bg-main);
    color: var(--text-primary);
  }
</style>
<button class="dark-mode-toggle-btn" id="darkModeToggle" aria-label="Toggle Dark Mode">
  <span id="darkModeIcon">🌙</span>
</button>
<script>
  (function() {
    const toggleBtn = document.getElementById('darkModeToggle');
    const body = document.body;
    const icon = document.getElementById('darkModeIcon');
    
    // Check local storage for theme preference
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
      icon.textContent = '☀️';
    }
    
    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
        icon.textContent = '☀️';
      } else {
        localStorage.setItem('theme', 'light');
        icon.textContent = '🌙';
      }
    });
  })();
</script>
