<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Core | Admin Panel</title>
    <link rel="shortcut icon" href="vani_icon.png" type="image/x-icon">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #f8fafc;
            --saffron: #ea580c; 
            --white-glow: #0f172a; 
            --india-green: #16a34a; 
            --navy-blue: #1e3a8a;
            --text-main: #334155;
            --glass-bg: rgba(255, 255, 255, 0.6); /* More transparent for frosted glass */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }



        /* --- Layout & Core --- */
        .admin-layout {
            position: relative;
            z-index: 10;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px;
            animation: bootUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes bootUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); filter: blur(10px); }
            50% { opacity: 0.8; filter: blur(2px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* --- Header & HUD --- */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            position: relative;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }
        
        /* HUD Brackets */
        .admin-header::before {
            content: ''; position: absolute; top: 0; left: 0; width: 20px; height: 20px;
            border-top: 3px solid var(--saffron); border-left: 3px solid var(--saffron);
            border-radius: 15px 0 0 0;
        }
        .admin-header::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 20px; height: 20px;
            border-bottom: 3px solid var(--india-green); border-right: 3px solid var(--india-green);
            border-radius: 0 0 15px 0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-title img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(#fff, #fff) padding-box, linear-gradient(45deg, var(--saffron), var(--navy-blue), var(--india-green)) border-box;
            box-shadow: 0 0 25px rgba(30, 58, 138, 0.2);
            animation: pulseRing 2s infinite;
        }

        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(30, 58, 138, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(30, 58, 138, 0); }
            100% { box-shadow: 0 0 0 0 rgba(30, 58, 138, 0); }
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--saffron) 0%, var(--navy-blue) 50%, var(--india-green) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* --- Buttons --- */
        .btn-back {
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.1);
            color: var(--text-main);
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Outfit';
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .btn-back::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(234, 88, 12, 0.2), transparent);
            transition: 0.5s;
        }
        .btn-back:hover::before { left: 100%; }
        .btn-back:hover {
            border-color: var(--saffron);
            background: #fff;
            color: var(--saffron);
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.2);
            transform: translateY(-3px) scale(1.05);
        }

        /* --- Data Panel & Glassmorphism --- */
        .data-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 3px solid rgba(234, 88, 12, 0.8);
            border-bottom: 3px solid rgba(22, 163, 74, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.05), 
                0 0 50px rgba(255, 255, 255, 0.8) inset,
                0 0 20px rgba(30, 58, 138, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Scanning Laser over panel */
        .data-panel::after {
            content: '';
            position: absolute;
            top: -100%; left: 0;
            width: 100%; height: 200px;
            background: linear-gradient(to bottom, transparent, rgba(30, 58, 138, 0.03) 50%, rgba(30, 58, 138, 0.1) 100%);
            border-bottom: 2px solid rgba(30, 58, 138, 0.3);
            animation: scanDown 4s linear infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes scanDown {
            0% { top: -100%; }
            100% { top: 200%; }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .panel-header h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            color: var(--white-glow);
            letter-spacing: 3px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .panel-header h2 i {
            color: var(--navy-blue);
            animation: pulseIcon 2s infinite;
        }
        @keyframes pulseIcon { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

        .badge {
            background: rgba(30, 58, 138, 0.2);
            color: var(--saffron);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            border: 1px solid rgba(234, 88, 12, 0.3);
            box-shadow: 0 0 15px rgba(234, 88, 12, 0.1);
        }

        /* --- Controls Bar --- */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            position: relative;
            z-index: 2;
        }
        
        .controls-left { display: flex; gap: 15px; flex: 1; }
        
        .search-input {
            flex: 1;
            max-width: 300px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: 'Space Grotesk';
            outline: none;
        }
        .search-input:focus { border-color: var(--saffron); }
        
        .sort-select {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: 'Space Grotesk';
            outline: none;
            cursor: pointer;
        }
        
        .btn-export {
            background: rgba(22, 163, 74, 0.2);
            border: 1px solid var(--india-green);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Outfit';
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-export:hover { background: var(--india-green); }

        /* --- Table Styling --- */
        .table-responsive {
            overflow-x: auto;
            position: relative;
            z-index: 2;
            padding-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
            text-align: left;
        }

        th {
            font-family: 'Rajdhani', sans-serif;
            color: var(--navy-blue);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1rem;
            padding: 15px 20px;
            border-bottom: 2px solid rgba(30, 58, 138, 0.1);
        }

        td {
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.8);
            border-left: none;
            border-right: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            position: relative;
        }
        
        td:first-child { 
            border-left: 3px solid transparent; 
            border-radius: 12px 0 0 12px; 
        }
        
        tr:hover td {
            background: rgba(255, 255, 255, 0.95);
        }

        .pin-cell {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--saffron);
            letter-spacing: 6px;
        }
        
        .name-cell {
            font-weight: 800;
            color: var(--white-glow);
            letter-spacing: 1px;
            font-size: 1.1rem;
        }
        .email-cell {
            color: var(--text-dim);
            font-weight: 600;
        }

        /* --- Action Buttons --- */
        .btn-action {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 5px;
            transition: 0.2s;
        }
        .btn-action.delete:hover { background: #ef4444; border-color: #ef4444; }
        .btn-action.reset:hover { background: var(--saffron); border-color: var(--saffron); }

        /* --- Logs Panel --- */
        .logs-panel {
            margin-top: 30px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }
        .logs-header {
            font-family: 'Rajdhani';
            color: var(--white-glow);
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .log-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .log-item {
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }
        .log-item span.email { color: var(--saffron); font-weight: bold; }
        .log-item span.time { color: #94a3b8; font-size: 0.75rem; }

        /* --- Loader --- */
        .loading-state {
            text-align: center;
            padding: 80px;
            color: var(--saffron);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulseLoading 2s infinite alternate;
        }
        @keyframes pulseLoading {
            0% { opacity: 0.5; filter: blur(2px); }
            100% { opacity: 1; filter: blur(0); }
        }

        .loader-spinner {
            display: inline-block;
            width: 60px; height: 60px;
            border: 3px solid rgba(30, 58, 138, 0.1);
            border-top: 4px solid var(--saffron);
            border-bottom: 4px solid var(--india-green);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(234, 88, 12, 0.15);
        }

        /* --- Scramble & Glitch Effects --- */
        .scramble-char {
            color: var(--saffron);
            font-family: monospace;
            opacity: 0.8;
            font-weight: bold;
        }

        .glitch-hover {
            position: relative;
        }
        .glitch-hover:hover {
            animation: glitchSkew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            color: var(--saffron);
        }

        @keyframes glitchSkew {
            0% { transform: translate(0) skew(0deg); }
            20% { transform: translate(-2px, 1px) skew(2deg); }
            40% { transform: translate(-1px, -1px) skew(-2deg); }
            60% { transform: translate(2px, 1px) skew(0deg); }
            80% { transform: translate(1px, -1px) skew(1deg); }
            100% { transform: translate(0) skew(0deg); }
        }

        .row-jitter:hover {
            animation: jitter 0.1s infinite;
        }
        
        @keyframes jitter {
            0% { transform: translateX(0); }
            50% { transform: translateX(1px); }
            100% { transform: translateX(-1px); }
        }

        .data-panel:hover .badge {
            animation: badgeBreathe 0.5s ease-in-out infinite alternate;
        }

    </style>
</head>
<body>
    


    <div class="admin-layout" style="display:none;" id="admin-content">
        <header class="admin-header">
            <div class="header-title">
                <img src="vani_logo.jpg" alt="Logo">
                <h1>Bharat Core Command</h1>
            </div>
            <button class="btn-back" onclick="window.location.href='/?launch=true'">
                <i class="fa-solid fa-satellite-dish"></i> Return to Console
            </button>
        </header>

        <main class="data-panel">
            <div class="panel-header">
                <h2><i class="fa-solid fa-users-viewfinder" style="color:var(--saffron);"></i> Registered Personnel</h2>
                <div class="badge" id="user-count">Scanning...</div>
            </div>

            <div class="controls-bar">
                <div class="controls-left">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by name or email..." oninput="handleSearch()">
                    <select id="sortSelect" class="sort-select" onchange="handleSort()">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="name">Name A-Z</option>
                    </select>
                </div>
                <button class="btn-export" onclick="exportCSV()"><i class="fa-solid fa-download"></i> Export CSV</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID Hash</th>
                            <th>Identity Name</th>
                            <th>Clearance Email</th>
                            <th>Security PIN</th>
                            <th>Registration Sync</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <tr>
                            <td colspan="6">
                                <div class="loading-state">
                                    <div class="loader-spinner"></div><br>
                                    Decrypting Database...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="logs-panel">
                <div class="logs-header"><i class="fa-solid fa-network-wired" style="color:var(--saffron);"></i> Live Activity Feed</div>
                <div class="log-list" id="logList">
                    <div class="log-item" style="color:#94a3b8; justify-content:center;">Connecting to live stream...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAUsbCzU-CfBGDIm1xqLMDaq5uzjWorvE",
            authDomain: "vani-nzdrsr.firebaseapp.com",
            projectId: "vani-nzdrsr",
            storageBucket: "vani-nzdrsr.firebasestorage.app",
            messagingSenderId: "908306821780",
            appId: "1:908306821780:web:02e878153145968d113a81"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();



        // Enforce Admin Access
        auth.onAuthStateChanged(user => {
            if (user) {
                if (user.email === 'official.vani.xai76@gmail.com') {
                    // Access Granted
                    document.getElementById('admin-content').style.display = 'block';
                    loadUsers();
                } else {
                    // Intruder
                    alert("SECURITY BREACH: Unauthorized access detected. Redirecting.");
                    window.location.href = '/?launch=true';
                }
            } else {
                window.location.href = '/auth-vani-xai.html';
            }
        });



        let allUsers = [];

        async function loadUsers() {
            try {
                const snapshot = await db.collection('users').orderBy('createdAt', 'desc').get();
                allUsers = [];
                snapshot.forEach(doc => {
                    allUsers.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
            } catch (err) {
                console.error("Error loading users:", err);
                const countBadge = document.getElementById('user-count');
                countBadge.textContent = "Error";
                const tbody = document.getElementById('user-table-body');
                tbody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;"><strong>Database Error:</strong> ${err.message}</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            
            const search = document.getElementById('searchInput').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;

            // Filter
            let filtered = allUsers.filter(u => 
                (u.name || '').toLowerCase().includes(search) || 
                (u.email || '').toLowerCase().includes(search)
            );

            // Sort
            filtered.sort((a, b) => {
                const tA = a.createdAt ? a.createdAt.toMillis() : 0;
                const tB = b.createdAt ? b.createdAt.toMillis() : 0;
                if (sort === 'newest') return tB - tA;
                if (sort === 'oldest') return tA - tB;
                if (sort === 'name') return (a.name || '').localeCompare(b.name || '');
                return 0;
            });

            document.getElementById('user-count').textContent = filtered.length + " ACTIVE";

            filtered.forEach(data => {
                const dateStr = data.createdAt ? data.createdAt.toDate().toLocaleDateString() + ' ' + data.createdAt.toDate().toLocaleTimeString() : 'Unknown';
                const tr = document.createElement('tr');

                const safeName = (data.name || 'N/A').replace(/"/g, '&quot;');
                const safeEmail = (data.email || 'N/A').replace(/"/g, '&quot;');
                const safePin = (data.pin ? String(data.pin) : 'NOT SET').replace(/"/g, '&quot;');

                tr.innerHTML = `
                    <td style="font-size:0.75rem; color:#64748b;">${data.id}</td>
                    <td class="name-cell">${safeName}</td>
                    <td class="email-cell">${safeEmail}</td>
                    <td class="pin-cell" style="color:var(--saffron)">${safePin}</td>
                    <td style="font-size:0.8rem; color:#94a3b8;">${dateStr}</td>
                    <td>
                        <button class="btn-action reset" onclick="resetUserPin('${data.id}')" title="Force Pin Reset"><i class="fa-solid fa-key"></i></button>
                        <button class="btn-action delete" onclick="deleteUser('${data.id}')" title="Delete User"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleSearch() { renderTable(); }
        function handleSort() { renderTable(); }

        async function deleteUser(id) {
            if(!confirm("Are you sure you want to permanently delete this user's data?")) return;
            try {
                await db.collection('users').doc(id).delete();
                allUsers = allUsers.filter(u => u.id !== id);
                renderTable();
            } catch(e) { alert("Error deleting user: " + e.message); }
        }

        async function resetUserPin(id) {
            if(!confirm("Are you sure you want to force this user to reset their PIN?")) return;
            try {
                await db.collection('users').doc(id).update({ pin: firebase.firestore.FieldValue.delete() });
                const user = allUsers.find(u => u.id === id);
                if(user) user.pin = null;
                renderTable();
            } catch(e) { alert("Error resetting PIN: " + e.message); }
        }

        function exportCSV() {
            if(allUsers.length === 0) return alert("No data to export.");
            let csvContent = "data:text/csv;charset=utf-8,ID,Name,Email,PIN,Date Joined\\n";
            allUsers.forEach(u => {
                const dateStr = u.createdAt ? u.createdAt.toDate().toISOString() : 'Unknown';
                csvContent += `"${u.id}","${u.name || ''}","${u.email || ''}","${u.pin || ''}","${dateStr}"\\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "vanixai_users.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Live Logs Subscription
        function setupLogsListener() {
            db.collection('logs').orderBy('timestamp', 'desc').limit(20).onSnapshot(snapshot => {
                const logList = document.getElementById('logList');
                logList.innerHTML = '';
                if(snapshot.empty) {
                    logList.innerHTML = '<div class="log-item" style="color:#94a3b8; justify-content:center;">No recent activity</div>';
                    return;
                }
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const time = data.timestamp ? data.timestamp.toDate().toLocaleTimeString() : 'Just now';
                    logList.innerHTML += `
                        <div class="log-item">
                            <div><span class="email">${data.email || 'Unknown'}</span> - ${data.activity}</div>
                            <span class="time">${time}</span>
                        </div>
                    `;
                });
            });
        }
        setupLogsListener();
    </script>
</body>
</html>
