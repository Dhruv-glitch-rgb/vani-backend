<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Core | Admin Panel</title>
    <link rel="shortcut icon" href="vani_icon.png" type="image/x-icon">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #f8fafc;
            --saffron: #ea580c; 
            --white-glow: #0f172a; 
            --india-green: #16a34a; 
            --navy-blue: #1e3a8a;
            --text-main: #334155;
            --glass-bg: rgba(255, 255, 255, 0.6); /* More transparent for frosted glass */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Holographic Background --- */
        .ambient-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(234, 88, 12, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(22, 163, 74, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
            animation: gridPulse 4s ease-in-out infinite alternate, moveGrid 30s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(25px) scale(1.02); }
            100% { transform: translateY(50px) scale(1); }
        }
        @keyframes gridPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .ashoka-chakra-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vh; height: 80vh;
            border: 2px dashed rgba(30, 58, 138, 0.15);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: slowSpin 20s linear infinite;
            box-shadow: 0 0 100px rgba(234, 88, 12, 0.08) inset, 0 0 100px rgba(22, 163, 74, 0.08) inset;
        }
        .ashoka-chakra-bg::before {
            content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 1px solid rgba(30, 58, 138, 0.05); border-radius: 50%;
            animation: slowSpin 30s linear infinite reverse;
        }
        .ashoka-chakra-bg::after {
            content: "☸";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60vh;
            color: rgba(30, 58, 138, 0.05);
            text-shadow: 0 0 40px rgba(30, 58, 138, 0.15);
        }

        @keyframes slowSpin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .glow-saffron {
            position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(234, 88, 12, 0.15) 0%, transparent 60%);
            z-index: 0; filter: blur(60px);
            animation: pulseGlow 4s ease-in-out infinite alternate, floatOrb 10s ease-in-out infinite;
        }
        .glow-green {
            position: fixed; bottom: -10%; right: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(22, 163, 74, 0.15) 0%, transparent 60%);
            z-index: 0; filter: blur(60px);
            animation: pulseGlow 5s ease-in-out infinite alternate-reverse, floatOrb 12s ease-in-out infinite reverse;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
            100% { transform: translate(0, 0); }
        }

        /* --- Floating Particles --- */
        .particle {
            position: fixed;
            background: rgba(30, 58, 138, 0.3);
            width: 3px; height: 3px;
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; transform: translateY(80vh) scale(1); }
            80% { opacity: 1; transform: translateY(20vh) scale(1); }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        /* --- Layout & Core --- */
        .admin-layout {
            position: relative;
            z-index: 10;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px;
            animation: bootUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes bootUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); filter: blur(10px); }
            50% { opacity: 0.8; filter: blur(2px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* --- Header & HUD --- */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            position: relative;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }
        
        /* HUD Brackets */
        .admin-header::before {
            content: ''; position: absolute; top: 0; left: 0; width: 20px; height: 20px;
            border-top: 3px solid var(--saffron); border-left: 3px solid var(--saffron);
            border-radius: 15px 0 0 0;
        }
        .admin-header::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 20px; height: 20px;
            border-bottom: 3px solid var(--india-green); border-right: 3px solid var(--india-green);
            border-radius: 0 0 15px 0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-title img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(#fff, #fff) padding-box, linear-gradient(45deg, var(--saffron), var(--navy-blue), var(--india-green)) border-box;
            box-shadow: 0 0 25px rgba(30, 58, 138, 0.2);
            animation: pulseRing 2s infinite;
        }

        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(30, 58, 138, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(30, 58, 138, 0); }
            100% { box-shadow: 0 0 0 0 rgba(30, 58, 138, 0); }
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--saffron) 0%, var(--navy-blue) 50%, var(--india-green) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* --- Buttons --- */
        .btn-back {
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.1);
            color: var(--text-main);
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Outfit';
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .btn-back::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(234, 88, 12, 0.2), transparent);
            transition: 0.5s;
        }
        .btn-back:hover::before { left: 100%; }
        .btn-back:hover {
            border-color: var(--saffron);
            background: #fff;
            color: var(--saffron);
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.2);
            transform: translateY(-3px) scale(1.05);
        }

        /* --- Data Panel & Glassmorphism --- */
        .data-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 3px solid rgba(234, 88, 12, 0.8);
            border-bottom: 3px solid rgba(22, 163, 74, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.05), 
                0 0 50px rgba(255, 255, 255, 0.8) inset,
                0 0 20px rgba(30, 58, 138, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Scanning Laser over panel */
        .data-panel::after {
            content: '';
            position: absolute;
            top: -100%; left: 0;
            width: 100%; height: 200px;
            background: linear-gradient(to bottom, transparent, rgba(30, 58, 138, 0.03) 50%, rgba(30, 58, 138, 0.1) 100%);
            border-bottom: 2px solid rgba(30, 58, 138, 0.3);
            animation: scanDown 4s linear infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes scanDown {
            0% { top: -100%; }
            100% { top: 200%; }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .panel-header h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            color: var(--white-glow);
            letter-spacing: 3px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .panel-header h2 i {
            color: var(--navy-blue);
            animation: pulseIcon 2s infinite;
        }
        @keyframes pulseIcon { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

        .badge {
            background: linear-gradient(135deg, rgba(234, 88, 12, 0.1), rgba(234, 88, 12, 0.2));
            color: var(--saffron);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 800;
            border: 1px solid rgba(234, 88, 12, 0.4);
            box-shadow: 0 4px 15px rgba(234, 88, 12, 0.2);
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: badgeBreathe 2s ease-in-out infinite alternate;
        }
        @keyframes badgeBreathe {
            0% { box-shadow: 0 0 10px rgba(234, 88, 12, 0.1); transform: scale(1); }
            100% { box-shadow: 0 0 20px rgba(234, 88, 12, 0.4); transform: scale(1.02); }
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
            position: relative;
            z-index: 2;
            padding-bottom: 20px; /* space for hover effects */
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px; /* more spacing for floating effect */
            text-align: left;
        }

        th {
            font-family: 'Rajdhani', sans-serif;
            color: var(--navy-blue);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1rem;
            padding: 15px 20px;
            border-bottom: 2px solid rgba(30, 58, 138, 0.1);
        }

        td {
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.8);
            border-left: none;
            border-right: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            position: relative;
        }
        
        td:first-child { 
            border-left: 3px solid transparent; 
            border-radius: 12px 0 0 12px; 
        }
        td:last-child { 
            border-right: 1px solid rgba(255,255,255,0.8); 
            border-radius: 0 12px 12px 0; 
        }

        tr {
            opacity: 0;
            animation: rowFadeIn 0.5s ease-out forwards;
        }

        @keyframes rowFadeIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(30, 58, 138, 0.1);
            z-index: 10;
        }
        tr:hover td:first-child {
            border-left: 3px solid var(--saffron);
        }

        .pin-cell {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--saffron);
            letter-spacing: 6px;
            background: rgba(234, 88, 12, 0.05);
            padding: 5px 15px;
            border-radius: 8px;
            border: 1px dashed rgba(234, 88, 12, 0.2);
            display: inline-block;
        }
        
        .name-cell {
            font-weight: 800;
            color: var(--white-glow);
            letter-spacing: 1px;
            font-size: 1.1rem;
        }
        .email-cell {
            color: var(--text-dim);
            font-weight: 500;
        }

        .loading-state {
            text-align: center;
            padding: 80px;
            color: var(--saffron);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulseLoading 2s infinite alternate;
        }
        @keyframes pulseLoading {
            0% { opacity: 0.5; filter: blur(2px); }
            100% { opacity: 1; filter: blur(0); }
        }

        .loader-spinner {
            display: inline-block;
            width: 60px; height: 60px;
            border: 3px solid rgba(30, 58, 138, 0.1);
            border-top: 4px solid var(--saffron);
            border-bottom: 4px solid var(--india-green);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(234, 88, 12, 0.15);
        }

        /* --- Scramble & Glitch Effects --- */
        .scramble-char {
            color: var(--saffron);
            font-family: monospace;
            opacity: 0.8;
            font-weight: bold;
        }

        .glitch-hover {
            position: relative;
        }
        .glitch-hover:hover {
            animation: glitchSkew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            color: var(--saffron);
        }

        @keyframes glitchSkew {
            0% { transform: translate(0) skew(0deg); }
            20% { transform: translate(-2px, 1px) skew(2deg); }
            40% { transform: translate(-1px, -1px) skew(-2deg); }
            60% { transform: translate(2px, 1px) skew(0deg); }
            80% { transform: translate(1px, -1px) skew(1deg); }
            100% { transform: translate(0) skew(0deg); }
        }

        .row-jitter:hover {
            animation: jitter 0.1s infinite;
        }
        
        @keyframes jitter {
            0% { transform: translateX(0); }
            50% { transform: translateX(1px); }
            100% { transform: translateX(-1px); }
        }

        .data-panel:hover .badge {
            animation: badgeBreathe 0.5s ease-in-out infinite alternate;
        }

    </style>
</head>
<body>

    <div class="ambient-grid"></div>
    <div class="glow-saffron"></div>

    <div class="ashoka-chakra-bg"></div>

    <div class="admin-layout" style="display:none;" id="admin-content">

        <main class="data-panel">

            <div class="table-responsive">

                                </div>

                </table>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAUsbCzU-CfBGDIm1xqLMDaq5uzjWorvE",
            authDomain: "vani-nzdrsr.firebaseapp.com",

            storageBucket: "vani-nzdrsr.firebasestorage.app",

        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Enforce Admin Access
        auth.onAuthStateChanged(user => {
            if (user) {
                if (user.email === 'official.vani.xai76@gmail.com') {

        // Sci-Fi Text Scramble Effect
        class TextScramble {
            constructor(el) {
                this.el = el;
                this.chars = '!<>-_\\/[]{}—=+*^?#_0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                this.update = this.update.bind(this);
            }
            setText(newText) {
                const oldText = this.el.innerText;
                const length = Math.max(oldText.length, newText.length);
                const promise = new Promise((resolve) => this.resolve = resolve);
                this.queue = [];
                for (let i = 0; i < length; i++) {
                    const from = oldText[i] || '';
                    const to = newText[i] || '';
                    const start = Math.floor(Math.random() * 40);
                    const end = start + Math.floor(Math.random() * 40);
                    this.queue.push({ from, to, start, end });
                }
                cancelAnimationFrame(this.frameRequest);
                this.frame = 0;
                this.update();
                return promise;
            }
            update() {
                let output = '';
                let complete = 0;
                for (let i = 0, n = this.queue.length; i < n; i++) {
                    let { from, to, start, end, char } = this.queue[i];
                    if (this.frame >= end) {
                        complete++;
                        output += to;
                    } else if (this.frame >= start) {
                        if (!char || Math.random() < 0.28) {
                            char = this.randomChar();
                            this.queue[i].char = char;
                        }
                        output += `<span class="scramble-char">${char}</span>`;
                    } else {
                        output += from;
                    }
                }
                this.el.innerHTML = output;
                if (complete === this.queue.length) {
                    this.resolve();
                } else {
                    this.frameRequest = requestAnimationFrame(this.update);
                    this.frame++;
                }
            }
            randomChar() {
                return this.chars[Math.floor(Math.random() * this.chars.length)];
            }
        }

        // Load Users from Firestore
        async function loadUsers() {
            try {
                const snapshot = await firebase.firestore().collection('users').orderBy('createdAt', 'desc').get();
                const tbody = document.getElementById('user-table-body');
                tbody.innerHTML = '';
                
                const countBadge = document.getElementById('user-count');
                const fx = new TextScramble(countBadge);
                fx.setText(snapshot.docs.length + " ACTIVE");

                let delay = 0;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const dateStr = data.createdAt ? data.createdAt.toDate().toLocaleDateString() + ' ' + data.createdAt.toDate().toLocaleTimeString() : 'Unknown';
                    const tr = document.createElement('tr');
                    tr.className = 'row-jitter';
                    tr.style.animationDelay = `${delay}s`;
                    delay += 0.15; // Stagger effect

                    tr.innerHTML = `
                        <td style="font-size:0.75rem; color:#64748b;" class="scramble-target" data-text="${doc.id}">Loading...</td>
                        <td class="name-cell scramble-target" data-text="${data.name || 'N/A'}">Loading...</td>
                        <td class="email-cell scramble-target" data-text="${data.email || 'N/A'}">Loading...</td>
                        <td class="pin-cell scramble-target" style="color:var(--saffron)" data-text="${data.pin ? data.pin : 'NOT SET'}">***</td>
                        <td style="font-size:0.8rem; color:#94a3b8;" class="scramble-target" data-text="${dateStr}">Loading...</td>
                    `;
                    tbody.appendChild(tr);

                    // Scramble text animation for each cell
                    setTimeout(() => {
                        tr.querySelectorAll('.scramble-target').forEach(el => {
                            const targetText = el.getAttribute('data-text');
                            const scrambler = new TextScramble(el);
                            scrambler.setText(targetText);
                        });
                    }, delay * 1000 + 500); // Wait for row fade in + offset
                });
            } catch (err) {
                console.error("Error loading users:", err);
                const countBadge = document.getElementById('user-count');
                countBadge.textContent = "Error";
            }
        }

        // Generate Particles
        function generateParticles() {
            const container = document.getElementById('particles-container');
            for(let i = 0; i < 35; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 4 + 4) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }
        generateParticles();
    </script>
