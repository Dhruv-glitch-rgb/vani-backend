<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initializing V.A.N.I-xAI Core...</title>
    <link rel="shortcut icon" href="vani_icon.png" type="image/x-icon">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Grid Background */
        .cyber-grid {
            position: absolute;
            width: 200vw;
            height: 200vh;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: 0;
            opacity: 0.4;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        /* Ambient Glows */
        .ambient-glow {
            position: absolute;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            opacity: 0.3;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }
        .glow-1 { top: -10%; left: -10%; background: var(--accent-cyan); }
        .glow-2 { bottom: -10%; right: -10%; background: var(--accent-purple); }

        @keyframes pulseGlow {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 0.4; transform: scale(1.1); }
        }

        /* Glassmorphism Card */
        .splash-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(6, 182, 212, 0.2);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Logo Animation */
        .logo-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
        }

        .vani-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Scanning Ring */
        .scanner-ring {
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border: 2px solid transparent;
            border-top-color: var(--accent-cyan);
            border-bottom-color: var(--accent-purple);
            border-radius: 50%;
            z-index: 1;
            animation: spinRing 2s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* User Identity Section */
        .user-identity {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        .user-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--text-muted);
            background: var(--bg-color);
        }

        .welcome-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .user-name {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.1s linear;
        }

        /* Terminal Loading Text */
        .terminal-text {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: var(--accent-cyan);
            height: 20px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--accent-cyan);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="splash-card">
        <div class="logo-container">
            <div class="scanner-ring"></div>
            <img src="vani_icon.png" alt="V.A.N.I-xAI" class="vani-logo">
        </div>

        <div class="user-identity">
            <img src="https://ui-avatars.com/api/?name=User&background=0b0f19&color=06b6d4" alt="User" class="user-avatar" id="user-avatar">
            <div>
                <div class="welcome-text">Authenticating Commander</div>
                <div class="user-name" id="user-name">Loading...</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="terminal-text">
            <span id="loading-status">Establishing secure connection</span><span class="cursor"></span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAAUsbCzU-CfBGDIm1xqLMDaq5uzjWorvE",
            authDomain: "vani-nzdrsr.firebaseapp.com",
            projectId: "vani-nzdrsr",
            storageBucket: "vani-nzdrsr.firebasestorage.app",
            messagingSenderId: "908306821780",
            appId: "1:908306821780:web:02e878153145968d113a81",
            measurementId: "G-RJB5892YTQ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // UI Elements
        const userNameEl = document.getElementById('user-name');
        const userAvatarEl = document.getElementById('user-avatar');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('loading-status');

        // Status messages sequence
        const statuses = [
            "Establishing secure connection",
            "Verifying biometrics and credentials",
            "Syncing neural networks",
            "Loading Windows Automation drivers",
            "Connecting to ADB bridge",
            "Initializing OpenRouter AI Engine",
            "Finalizing V.A.N.I-xAI Core"
        ];

        // Random duration between 8000ms (8s) and 10000ms (10s)
        const totalDuration = Math.floor(Math.random() * 2000) + 8000;
        const intervalTime = 50; // update every 50ms
        const steps = totalDuration / intervalTime;
        let currentStep = 0;

        auth.onAuthStateChanged(user => {
            if (user) {
                // Fetch User Details
                const name = user.displayName || user.email.split('@')[0];
                const photo = user.photoURL || `https://ui-avatars.com/api/?name=${name}&background=0b0f19&color=06b6d4`;
                
                userNameEl.textContent = name;
                userAvatarEl.src = photo;

                // Start Progress Animation
                const progressInterval = setInterval(() => {
                    currentStep++;
                    const percent = (currentStep / steps) * 100;
                    progressBar.style.width = `${percent}%`;

                    // Update Status Text based on progress
                    const statusIndex = Math.min(
                        Math.floor((percent / 100) * statuses.length), 
                        statuses.length - 1
                    );
                    statusText.textContent = statuses[statusIndex] + "...";

                    if (currentStep >= steps) {
                        clearInterval(progressInterval);
                        statusText.textContent = "System Ready. Launching...";
                        setTimeout(() => {
                            window.location.href = '/?launch=true';
                        }, 500);
                    }
                }, intervalTime);

            } else {
                // Not logged in, shouldn't be here
                window.location.href = '/auth-vani-xai.html';
            }
        });
    </script>
</body>
</html>
