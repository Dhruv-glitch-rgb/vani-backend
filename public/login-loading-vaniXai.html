<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initializing V.A.N.I-xAI Core...</title>
    <link rel="shortcut icon" href="vani_icon.png" type="image/x-icon">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --core-glow: rgba(56, 189, 248, 0.15);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Breathing Core Background */
        .ambient-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, var(--core-glow) 0%, transparent 60%);
            z-index: 0;
            animation: breathe 8s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Premium Glassmorphism Card */
        .splash-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.1);
            transform: translateY(30px);
            opacity: 0;
            animation: slideUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            to { transform: translateY(0); opacity: 1; }
        }

        /* High-Tech Gyroscope Logo */
        .gyro-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gyro-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid transparent;
        }

        .ring-1 {
            width: 100%; height: 100%;
            border-top: 1px solid var(--accent-primary);
            border-bottom: 1px solid var(--accent-secondary);
            animation: spin 4s linear infinite;
        }

        .ring-2 {
            width: 85%; height: 85%;
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            border-right: 1px solid var(--accent-primary);
            animation: spin 3s linear infinite reverse;
        }

        .ring-3 {
            width: 70%; height: 70%;
            border-top: 1px dashed var(--accent-secondary);
            animation: spin 8s linear infinite;
        }

        .core-logo {
            width: 55%;
            height: 55%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 5;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Profile Section */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 1s ease 1s forwards;
        }

        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }

        .welcome-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .user-name {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Sleek Loading Bar */
        .loading-module {
            width: 100%;
            opacity: 0;
            animation: fadeUp 1s ease 1.5s forwards;
        }

        .progress-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            overflow: visible;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, transparent, var(--accent-primary));
            border-radius: 2px;
            position: absolute;
            top: 0; left: 0;
            transition: width 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-glow-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            right: -4px;
            top: -3px;
            box-shadow: 0 0 15px 4px var(--accent-primary);
        }

        .status-text {
            margin-top: 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            color: var(--accent-primary);
            letter-spacing: 1px;
            height: 20px;
            font-weight: 300;
            text-transform: uppercase;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Subtle grid overlay for texture */
        .texture-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="ambient-core"></div>
    <div class="texture-grid"></div>

    <div class="splash-container">
        
        <!-- Animated High-Tech Logo -->
        <div class="gyro-container">
            <div class="gyro-ring ring-1"></div>
            <div class="gyro-ring ring-2"></div>
            <div class="gyro-ring ring-3"></div>
            <img src="vani_logo.jpg" alt="V.A.N.I-xAI" class="core-logo">
        </div>

        <!-- User Identity -->
        <div class="profile-section">
            <img src="" id="user-avatar" class="user-avatar" style="display:none;">
            <div>
                <div class="welcome-label">Authorized Access</div>
                <div class="user-name" id="user-name">Initializing...</div>
            </div>
        </div>

        <!-- Progress System -->
        <div class="loading-module">
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar">
                    <div class="progress-glow-dot"></div>
                </div>
            </div>
            <div class="status-text" id="status-text">Booting Core Systems...</div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAAUsbCzU-CfBGDIm1xqLMDaq5uzjWorvE",
            authDomain: "vani-nzdrsr.firebaseapp.com",
            projectId: "vani-nzdrsr",
            storageBucket: "vani-nzdrsr.firebasestorage.app",
            messagingSenderId: "908306821780",
            appId: "1:908306821780:web:02e878153145968d113a81"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // UI Elements
        const userNameEl = document.getElementById('user-name');
        const userAvatarEl = document.getElementById('user-avatar');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');

        // Elegant boot sequence messages
        const messages = [
            "Establishing secure neural link",
            "Verifying biometric clearance",
            "Synchronizing global data nodes",
            "Initializing PyAutoGUI subsystem",
            "Mounting ADB telemetry protocols",
            "Engaging OpenRouter AI matrix",
            "Calibrating system parameters",
            "Access Granted. Launching..."
        ];

        // Random duration between 8 and 10 seconds
        const duration = Math.floor(Math.random() * 2000) + 8000;
        const tick = 30; // Smooth 30ms updates
        const totalSteps = duration / tick;
        let currentStep = 0;

        auth.onAuthStateChanged(user => {
            if (user) {
                // Fetch Identity smoothly
                const name = user.displayName || user.email.split('@')[0];
                const photo = user.photoURL || `https://ui-avatars.com/api/?name=${name}&background=020617&color=38bdf8`;
                
                setTimeout(() => {
                    userAvatarEl.src = photo;
                    userAvatarEl.style.display = 'block';
                    userNameEl.textContent = name;
                }, 1000);

                // Progress Animation
                const interval = setInterval(() => {
                    currentStep++;
                    const percent = (currentStep / totalSteps) * 100;
                    progressBar.style.width = `${percent}%`;

                    // Update Status Text based on progress segments
                    const msgIndex = Math.min(
                        Math.floor((percent / 100) * messages.length), 
                        messages.length - 1
                    );
                    statusText.textContent = messages[msgIndex];

                    if (currentStep >= totalSteps) {
                        clearInterval(interval);
                        setTimeout(() => {
                            window.location.href = '/?launch=true';
                        }, 500);
                    }
                }, tick);

            } else {
                window.location.href = '/auth-vani-xai.html';
            }
        });
    </script>
</body>
</html>
