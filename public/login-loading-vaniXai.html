<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initializing V.A.N.I-xAI Core...</title>
    <link rel="shortcut icon" href="vani_icon.png" type="image/x-icon">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030613;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-green: #39ff14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Particle Canvas Background */
        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* HUD Overlay */
        .hud-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 2;
        }

        /* Glitch effect on corners */
        .hud-corner {
            position: absolute; width: 50px; height: 50px;
            border: 2px solid var(--neon-blue);
            z-index: 5;
            opacity: 0.7;
        }
        .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Main Container */
        .splash-core {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            background: rgba(3, 6, 19, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1) inset;
            padding: 40px;
            border-radius: 4px;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%);
        }

        /* Logo Area */
        .core-logo-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
        }

        .core-logo {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            object-fit: cover;
            position: relative;
            z-index: 5;
            box-shadow: 0 0 30px var(--neon-blue);
        }

        /* Orbiting Rings */
        .orbit-ring {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 2px solid var(--neon-pink);
            border-bottom: 2px solid var(--neon-blue);
            animation: spin 3s linear infinite;
        }
        .orbit-ring:nth-child(2) {
            top: -35px; left: -35px; right: -35px; bottom: -35px;
            border-top: 2px solid var(--neon-green);
            border-bottom: 2px solid transparent;
            animation: spin 5s linear infinite reverse;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* User Profile */
        .auth-profile {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 1s 1.5s forwards;
        }

        .auth-avatar {
            width: 60px; height: 60px;
            border-radius: 4px;
            border: 1px solid var(--neon-blue);
            object-fit: cover;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5));
        }

        .auth-details {
            text-align: left;
        }

        .auth-title {
            font-size: 0.8rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .auth-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Progress System */
        .loading-system {
            margin-top: 30px;
        }

        .progress-track {
            width: 100%;
            height: 15px;
            background: #000;
            border: 1px solid rgba(0, 243, 255, 0.5);
            padding: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            transition: width 0.1s linear;
        }

        .progress-scan {
            position: absolute;
            top: 0; left: 0; height: 100%; width: 20px;
            background: #fff;
            opacity: 0.5;
            filter: blur(5px);
            animation: scanBar 1.5s linear infinite;
        }

        @keyframes scanBar {
            0% { left: -20px; }
            100% { left: 100%; }
        }

        /* Terminal output */
        .terminal-log {
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--neon-green);
            text-align: left;
            height: 20px;
            display: flex;
            justify-content: space-between;
        }

        .terminal-percent {
            color: var(--neon-pink);
            font-weight: bold;
        }

        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>
    <!-- Particle Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- HUD Overlay -->
    <div class="hud-overlay"></div>
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>

    <div class="splash-core">
        <div class="core-logo-wrapper">
            <div class="orbit-ring"></div>
            <div class="orbit-ring"></div>
            <img src="vani_icon.png" class="core-logo" alt="V.A.N.I-xAI">
        </div>

        <div class="auth-profile">
            <img src="" id="user-avatar" class="auth-avatar" style="display:none;">
            <div class="auth-details">
                <div class="auth-title">Authorized Personnel</div>
                <div class="auth-name" id="user-name">ACCESSING...</div>
            </div>
        </div>

        <div class="loading-system">
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
                <div class="progress-scan"></div>
            </div>
            <div class="terminal-log">
                <span id="loading-status">Establishing Secure Connection...</span>
                <span class="terminal-percent" id="loading-percent">0%</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script>
        /* --- Particle System Background --- */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 1,
                    speedY: Math.random() * 2 - 1,
                    speedX: Math.random() * 2 - 1,
                    color: Math.random() > 0.5 ? '#00f3ff' : '#ff00ea'
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'lighter';
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if(p.x < 0) p.x = width;
                if(p.x > width) p.x = 0;
                if(p.y < 0) p.y = height;
                if(p.y > height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        initCanvas();
        animateParticles();
        window.addEventListener('resize', initCanvas);

        /* --- Hacker Text Decoder Effect --- */
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
        function decodeText(element, finalString) {
            let iterations = 0;
            const interval = setInterval(() => {
                element.innerText = finalString.split('').map((letter, index) => {
                    if (index < iterations) return finalString[index];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                if (iterations >= finalString.length) clearInterval(interval);
                iterations += 1/3;
            }, 30);
        }

        /* --- Firebase & Loading Logic --- */
        const firebaseConfig = {
            apiKey: "AIzaSyAAUsbCzU-CfBGDIm1xqLMDaq5uzjWorvE",
            authDomain: "vani-nzdrsr.firebaseapp.com",
            projectId: "vani-nzdrsr",
            storageBucket: "vani-nzdrsr.firebasestorage.app",
            messagingSenderId: "908306821780",
            appId: "1:908306821780:web:02e878153145968d113a81"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const userNameEl = document.getElementById('user-name');
        const userAvatarEl = document.getElementById('user-avatar');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('loading-status');
        const percentText = document.getElementById('loading-percent');

        const logs = [
            "Bypassing mainframe security protocols",
            "Syncing quantum neural network nodes",
            "Decrypting Commander biometric hash",
            "Initializing PyAutoGUI automation core",
            "Mounting ADB shell bridge connection",
            "Allocating OpenRouter API subroutines",
            "Calibrating visual recognition modules",
            "System Online. Granting Access."
        ];

        // Random duration between 8000ms and 10000ms
        const duration = Math.floor(Math.random() * 2000) + 8000;
        const tick = 50;
        const totalSteps = duration / tick;
        let currentStep = 0;

        auth.onAuthStateChanged(user => {
            if (user) {
                // Fetch Identity
                const name = user.displayName || user.email.split('@')[0];
                const photo = user.photoURL || `https://ui-avatars.com/api/?name=${name}&background=030613&color=00f3ff&rounded=true`;
                
                setTimeout(() => {
                    userAvatarEl.src = photo;
                    userAvatarEl.style.display = 'block';
                    decodeText(userNameEl, name.toUpperCase());
                }, 1500);

                // Progress Bar
                const interval = setInterval(() => {
                    currentStep++;
                    const percent = Math.floor((currentStep / totalSteps) * 100);
                    progressBar.style.width = `${percent}%`;
                    percentText.innerText = `${percent}%`;

                    const logIndex = Math.min(Math.floor((percent / 100) * logs.length), logs.length - 1);
                    if(percent < 100) statusText.innerText = logs[logIndex] + "...";
                    else statusText.innerText = "ACCESS GRANTED";

                    if (currentStep >= totalSteps) {
                        clearInterval(interval);
                        setTimeout(() => window.location.href = '/?launch=true', 500);
                    }
                }, tick);

            } else {
                window.location.href = '/auth-vani-xai.html';
            }
        });
    </script>
</body>
</html>
