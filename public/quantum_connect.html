<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Connect - Cyberpunk Real-Time Messaging</title>
    <link rel="shortcut icon" href="/vani_icon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #020617;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --panel-border: rgba(99, 102, 241, 0.25);
            --accent-indigo: #6366f1;
            --accent-purple: #a855f7;
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background: var(--bg-dark) url('/inxv_bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .connect-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--panel-border);
            z-index: 10;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-box img { width: 36px; height: 36px; border-radius: 50%; filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6)); }
        .logo-box span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.15rem; color: var(--text-primary); }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-btn:hover { background: var(--accent-indigo); color: white; }

        /* Main Messaging Layout */
        .chat-app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
        }

        /* Left Chats Sidebar */
        .chats-sidebar {
            width: 320px;
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.7);
        }

        @media (max-width: 768px) {
            .chats-sidebar { width: 100%; display: flex; }
            .chats-sidebar.hidden-mobile { display: none; }
            .chat-main-panel.hidden-mobile { display: none; }
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 { font-size: 1.1rem; color: #a5b4fc; font-family: 'Space Grotesk', sans-serif; }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .chat-item:hover, .chat-item.active {
            background: rgba(99, 102, 241, 0.15);
        }

        .chat-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent-cyan); object-fit: cover; }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 700; font-size: 0.95rem; color: var(--text-primary); }
        .chat-last-msg { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .chat-meta { font-size: 0.72rem; color: #64748b; text-align: right; }

        /* Main Chat Window Panel */
        .chat-main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(2, 6, 23, 0.6);
        }

        .chat-active-header {
            padding: 14px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .active-user-info { display: flex; align-items: center; gap: 12px; }
        .active-user-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent-indigo); object-fit: cover; }
        .active-user-name { font-weight: 700; font-size: 1rem; color: var(--text-primary); }
        .active-user-status { font-size: 0.75rem; color: var(--accent-emerald); display: flex; align-items: center; gap: 6px; }

        .disappearing-toggle {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #c084fc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .disappearing-toggle.active {
            background: rgba(168, 85, 247, 0.4);
            color: white;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        /* Messages Body Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            max-width: 65%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .message-bubble.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .message-bubble.received {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 0.68rem;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .msg-ticks { color: #a5b4fc; font-weight: bold; }

        /* Media / Voice Attachment Styling */
        .chat-media-img {
            max-width: 240px;
            border-radius: 10px;
            margin-top: 5px;
            cursor: pointer;
        }

        .audio-player-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            margin-top: 4px;
        }

        /* Message Input Bar */
        .chat-input-bar {
            padding: 14px 20px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 18px;
            border-radius: 25px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input:focus { border-color: var(--accent-indigo); }

        .input-action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-action-btn:hover { background: var(--accent-indigo); color: white; }

        .send-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            transition: 0.2s;
        }

        .send-btn:hover { transform: scale(1.08); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="connect-header">
        <div class="logo-box" onclick="window.location.href='/ai4consol.html'">
            <img src="/vani_icon.png" alt="Logo">
            <span>V.A.N.I-xAI QUANTUM CONNECT</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <a href="/quantum_search" class="nav-btn">
                <i class="fa-solid fa-satellite-dish"></i> Radar Scanner
            </a>
            <a href="/ai4consol.html" class="nav-btn">
                <i class="fa-solid fa-home"></i> Console
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="chat-app-container">
        
        <!-- Sidebar Chats List -->
        <div class="chats-sidebar" id="chatsSidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-messages"></i> Active Paired Nodes</h3>
                <a href="/quantum_search" style="color: var(--accent-cyan); text-decoration: none; font-size: 0.8rem;"><i class="fa-solid fa-plus"></i> Pair New</a>
            </div>
            <div class="chats-list" id="chatsList">
                <div style="text-align: center; color: var(--text-secondary); padding: 40px 10px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--accent-indigo); margin-bottom: 10px;"></i>
                    <p style="font-size: 0.85rem;">Loading paired channels...</p>
                </div>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-main-panel" id="chatMainPanel">
            <div class="chat-active-header">
                <div class="active-user-info">
                    <img id="activePartnerAvatar" class="active-user-avatar" src="/vani_icon.png" alt="Avatar">
                    <div>
                        <div class="active-user-name" id="activePartnerName">Select a Paired Channel</div>
                        <div class="active-user-status" id="activePartnerStatus"><span style="width:7px; height:7px; border-radius:50%; background:#10b981;"></span> Online</div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="disappearing-toggle" id="disappearingBtn" onclick="toggleDisappearingMode()">
                        <i class="fa-solid fa-ghost"></i> Snapchat Mode OFF
                    </button>
                </div>
            </div>

            <!-- Messages Window -->
            <div class="messages-container" id="messagesContainer">
                <div style="text-align: center; margin: auto; color: var(--text-secondary); max-width: 320px;">
                    <i class="fa-solid fa-comments" style="font-size: 3rem; color: rgba(99, 102, 241, 0.4); margin-bottom: 15px;"></i>
                    <h3>Quantum P2P Encrypted Channel</h3>
                    <p style="font-size: 0.85rem; margin-top: 6px;">Select a paired contact from the left or scan nearby users with Quantum Radar to start chatting.</p>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="chat-input-bar">
                <label class="input-action-btn" title="Attach Image">
                    <i class="fa-solid fa-paperclip"></i>
                    <input type="file" id="mediaFileInput" accept="image/*" style="display: none;" onchange="handleImageAttach(this)">
                </label>
                <button class="input-action-btn" id="voiceRecBtn" title="Voice Note Record" onclick="toggleVoiceRecord()">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <input type="text" class="chat-input" id="messageInput" placeholder="Type a secure message..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-messaging-compat.js"></script>
    <script src="./fcm-notifications.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAUsbCzU-CfBGDIm1xqLMDaq5uzjWorvE",
            authDomain: "vani-nzdrsr.firebaseapp.com",
            projectId: "vani-nzdrsr",
            storageBucket: "vani-nzdrsr.firebasestorage.app",
            messagingSenderId: "908306821780",
            appId: "1:908306821780:web:02e878153145968d113a81"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let activeChatId = null;
        let activePartner = null;
        let disappearingMode = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // Parse query param chatId
        const urlParams = new URLSearchParams(window.location.search);
        const queryChatId = urlParams.get('chatId');

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = '/auth-vani-xai.html';
                return;
            }
            currentUser = user;
            if (window.VaniFCM) window.VaniFCM.init(user);

            loadPairedChats();

            if (queryChatId) {
                selectChat(queryChatId);
            }
        });

        const currentChatsMap = {};
        const userCache = {};

        function extractUserNameFromEmail(emailOrName) {
            if (!emailOrName) return null;
            if (emailOrName === 'Paired Node' || emailOrName === 'Quantum Paired Channel') return null;
            if (emailOrName.includes('@')) {
                return emailOrName.split('@')[0];
            }
            return emailOrName;
        }

        function getPartnerUsername(c) {
            if (!c) return currentUser && currentUser.email ? currentUser.email.split('@')[0] : 'UserName';

            // 1. Check partnerEmail directly
            if (c.partnerEmail) {
                const u = extractUserNameFromEmail(c.partnerEmail);
                if (u) return u;
            }

            // 2. Check participantEmails
            if (c.participantEmails) {
                if (typeof c.participantEmails === 'object' && !Array.isArray(c.participantEmails)) {
                    for (const uid in c.participantEmails) {
                        if (uid !== currentUser.uid && c.participantEmails[uid]) {
                            const u = extractUserNameFromEmail(c.participantEmails[uid]);
                            if (u) return u;
                        }
                    }
                } else if (Array.isArray(c.participantEmails)) {
                    const pEmail = c.participantEmails.find(e => e && currentUser && e !== currentUser.email);
                    if (pEmail) {
                        const u = extractUserNameFromEmail(pEmail);
                        if (u) return u;
                    }
                }
            }

            // 3. Check participantNames
            if (c.participantNames) {
                for (const uid in c.participantNames) {
                    if (uid !== currentUser.uid && c.participantNames[uid]) {
                        const u = extractUserNameFromEmail(c.participantNames[uid]);
                        if (u) return u;
                    }
                }
            }

            // 4. Check partnerName if valid
            if (c.partnerName) {
                const u = extractUserNameFromEmail(c.partnerName);
                if (u) return u;
            }

            // 5. Check userCache for partner UID
            const partnerUid = (c.participants || []).find(uid => uid !== (currentUser ? currentUser.uid : ''));
            if (partnerUid && userCache[partnerUid]) {
                return userCache[partnerUid];
            }

            // 6. Default fallback to current user's email username or 'UserName'
            if (currentUser && currentUser.email) {
                return currentUser.email.split('@')[0];
            }

            return 'UserName';
        }

        async function fetchPartnerDetails(chatId, partnerUid) {
            if (!partnerUid || userCache[partnerUid]) return;
            try {
                let uName = null;
                const uDoc = await db.collection('users').doc(partnerUid).get();
                if (uDoc.exists) {
                    const data = uDoc.data();
                    if (data.email) uName = extractUserNameFromEmail(data.email);
                    else if (data.name) uName = extractUserNameFromEmail(data.name);
                }
                if (!uName) {
                    const pairSnap = await db.collection('radar_pairings').where('pairId', '==', chatId).get();
                    pairSnap.forEach(pDoc => {
                        const pData = pDoc.data();
                        if (pData.senderUid === partnerUid && pData.senderEmail) uName = extractUserNameFromEmail(pData.senderEmail);
                        else if (pData.receiverUid === partnerUid && pData.receiverEmail) uName = extractUserNameFromEmail(pData.receiverEmail);
                        else if (pData.senderName) uName = extractUserNameFromEmail(pData.senderName);
                    });
                }
                if (uName) {
                    userCache[partnerUid] = uName;
                    const el = document.getElementById(`chat-name-${chatId}`);
                    if (el) el.textContent = uName;
                    if (activeChatId === chatId) {
                        document.getElementById('activePartnerName').textContent = uName;
                    }
                    db.collection('quantum_chats').doc(chatId).set({
                        partnerName: uName
                    }, { merge: true }).catch(() => {});
                }
            } catch (e) {
                console.log("Partner detail fetch error:", e);
            }
        }

        // Load active paired channels (Real Data Only)
        function loadPairedChats() {
            db.collection('quantum_chats')
              .where('participants', 'array-contains', currentUser.uid)
              .onSnapshot(snapshot => {
                  const chats = [];
                  snapshot.forEach(doc => {
                      const data = { id: doc.id, ...doc.data() };
                      currentChatsMap[doc.id] = data;
                      chats.push(data);
                  });
                  renderSidebarChats(chats);
                  if (activeChatId && currentChatsMap[activeChatId]) {
                      const activePartnerName = getPartnerUsername(currentChatsMap[activeChatId]);
                      document.getElementById('activePartnerName').textContent = activePartnerName;
                  }
              });
        }

        function renderSidebarChats(chats) {
            const listEl = document.getElementById('chatsList');
            if (chats.length === 0) {
                listEl.innerHTML = `
                    <div style="text-align: center; color: var(--text-secondary); padding: 40px 15px;">
                        <i class="fa-solid fa-satellite-dish" style="font-size: 2rem; color: #a5b4fc; margin-bottom: 12px;"></i>
                        <p style="font-size: 0.85rem;">No active paired channels yet.</p>
                        <a href="/quantum_search" style="display: inline-block; margin-top: 10px; color: var(--accent-cyan); font-weight: 600; text-decoration: none; font-size: 0.8rem;">
                            <i class="fa-solid fa-radar"></i> Scan Nearby Users
                        </a>
                    </div>
                `;
                return;
            }
            listEl.innerHTML = chats.map(c => {
                const partnerName = getPartnerUsername(c);
                const avatar = c.partnerAvatar || '/vani_icon.png';
                const lastMsg = c.lastMessage || 'Channel active';

                const partnerUid = (c.participants || []).find(uid => uid !== currentUser.uid);
                if (partnerUid && !userCache[partnerUid]) {
                    fetchPartnerDetails(c.id, partnerUid);
                }

                return `
                    <div class="chat-item ${c.id === activeChatId ? 'active' : ''}" onclick="selectChat('${c.id}')">
                        <img src="${avatar}" class="chat-avatar" alt="User">
                        <div class="chat-info">
                            <div class="chat-name" id="chat-name-${c.id}">${escapeHtml(partnerName)}</div>
                            <div class="chat-last-msg">${escapeHtml(lastMsg)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectChat(chatId) {
            activeChatId = chatId;
            const c = currentChatsMap[chatId];
            const partnerName = getPartnerUsername(c);

            // Set active header
            document.getElementById('activePartnerName').textContent = partnerName;
            document.getElementById('activePartnerAvatar').src = (c && c.partnerAvatar) ? c.partnerAvatar : '/vani_icon.png';

            listenToMessages(chatId);
        }

        // Real-Time Messages Subscription
        function listenToMessages(chatId) {
            const container = document.getElementById('messagesContainer');

            db.collection('quantum_chats').doc(chatId).collection('messages')
              .orderBy('timestamp', 'asc')
              .onSnapshot(snapshot => {
                  const msgs = [];
                  snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));

                  if (msgs.length === 0) {
                      container.innerHTML = `
                        <div style="text-align: center; margin: auto; color: var(--text-secondary);">
                            <i class="fa-solid fa-shield-halved" style="font-size: 2.5rem; color: #a5b4fc; margin-bottom: 10px;"></i>
                            <p>Encrypted P2P channel connected. Type a message below!</p>
                        </div>
                      `;
                      return;
                  }

                  container.innerHTML = msgs.map(m => {
                      const isSent = m.senderUid === currentUser.uid;
                      const timeStr = m.timestamp ? new Date(m.timestamp.toMillis()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now';

                      let bodyContent = escapeHtml(m.text || '');
                      if (m.mediaUrl) {
                          bodyContent += `<br><img src="${m.mediaUrl}" class="chat-media-img" onclick="window.open('${m.mediaUrl}')">`;
                      }
                      if (m.audioUrl) {
                          bodyContent += `<div class="audio-player-box"><audio controls src="${m.audioUrl}"></audio></div>`;
                      }

                      return `
                          <div class="message-bubble ${isSent ? 'sent' : 'received'}">
                              <div>${bodyContent}</div>
                              <div class="msg-time">
                                  ${timeStr} ${isSent ? '<span class="msg-ticks">✓✓</span>' : ''}
                              </div>
                          </div>
                      `;
                  }).join('');

                  container.scrollTop = container.scrollHeight;
              });
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text && !activeChatId) return;

            const targetChatId = activeChatId || 'demo_chat_1';
            input.value = '';

            const payload = {
                senderUid: currentUser.uid,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                disappearing: disappearingMode
            };

            try {
                await db.collection('quantum_chats').doc(targetChatId).collection('messages').add(payload);
                await db.collection('quantum_chats').doc(targetChatId).set({
                    lastMessage: text,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            } catch (err) {
                console.error('[Chat] Send error:', err);
            }
        }

        function toggleDisappearingMode() {
            disappearingMode = !disappearingMode;
            const btn = document.getElementById('disappearingBtn');
            btn.classList.toggle('active', disappearingMode);
            btn.innerHTML = disappearingMode ? `<i class="fa-solid fa-ghost"></i> Snapchat Mode ON 👻` : `<i class="fa-solid fa-ghost"></i> Snapchat Mode OFF`;
        }

        // Handle Image Attachment
        function handleImageAttach(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = async (e) => {
                const base64Img = e.target.result;
                const targetChatId = activeChatId || 'demo_chat_1';

                await db.collection('quantum_chats').doc(targetChatId).collection('messages').add({
                    senderUid: currentUser.uid,
                    text: '📷 Photo',
                    mediaUrl: base64Img,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            };

            reader.readAsDataURL(file);
        }

        // Voice Note Recorder (MediaRecorder API)
        async function toggleVoiceRecord() {
            const btn = document.getElementById('voiceRecBtn');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = async (e) => {
                            const audioUrl = e.target.result;
                            const targetChatId = activeChatId || 'demo_chat_1';
                            await db.collection('quantum_chats').doc(targetChatId).collection('messages').add({
                                senderUid: currentUser.uid,
                                text: '🎤 Voice Note',
                                audioUrl: audioUrl,
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.color = '#ef4444';
                    btn.style.borderColor = '#ef4444';
                } catch (err) {
                    alert('Microphone access denied or unsupported.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.style.color = '#cbd5e1';
                btn.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
