<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="500" height="800">
  <defs>
    <linearGradient id="mobileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Mobile Device Body Outline -->
  <rect width="500" height="800" rx="36" fill="url(#mobileBg)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  
  <!-- Notch / Speaker -->
  <rect x="180" y="14" width="140" height="18" rx="9" fill="#1e293b"/>
  <circle cx="295" cy="23" r="4" fill="#06b6d4"/>

  <!-- Top Mobile Bar -->
  <text x="30" y="65" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="700" font-size="18">Saras.WebSearch</text>
  <rect x="360" y="48" width="110" height="24" rx="12" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4"/>
  <text x="375" y="64" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="bold" font-size="10">IN-APP WEB</text>

  <!-- Mobile Search Bar -->
  <rect x="25" y="90" width="450" height="48" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="45" y="120" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="bold" font-size="15">G</text>
  <text x="70" y="120" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="14">Latest AI breakthroughs 2026</text>
  <circle cx="445" cy="114" r="14" fill="url(#neonBlue)"/>
  <text x="439" y="119" fill="#ffffff" font-family="sans-serif" font-size="11">🔍</text>

  <!-- Filter Pills -->
  <g transform="translate(25, 150)">
    <rect x="0" y="0" width="70" height="24" rx="12" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4"/>
    <text x="14" y="16" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="bold" font-size="11">Google</text>
    
    <rect x="80" y="0" width="95" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
    <text x="92" y="16" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11">DuckDuckGo</text>
    
    <rect x="185" y="0" width="80" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
    <text x="198" y="16" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11">Wikipedia</text>
    
    <rect x="275" y="0" width="85" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
    <text x="288" y="16" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11">AI Summary</text>
  </g>

  <!-- Mobile In-App Search Cards -->
  <!-- AI Overview -->
  <g transform="translate(25, 190)">
    <rect width="450" height="90" rx="12" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)"/>
    <text x="15" y="24" fill="#06b6d4" font-family="'Outfit', sans-serif" font-weight="bold" font-size="11">✨ SARAS AI OVERVIEW</text>
    <text x="15" y="46" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="12">Autonomous reasoning agents and multimodal foundation models</text>
    <text x="15" y="66" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="12">now execute multi-step workflows with real-time web grounding.</text>
  </g>

  <!-- Mobile In-App Browser Simulation Card -->
  <g transform="translate(25, 295)">
    <rect width="450" height="420" rx="14" fill="#0f172a" stroke="rgba(56, 189, 248, 0.25)"/>
    
    <!-- Mini Address Bar -->
    <rect x="12" y="12" width="426" height="28" rx="8" fill="#1e293b"/>
    <text x="25" y="30" fill="#10b981" font-size="10">🔒</text>
    <text x="42" y="30" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="11">https://google.com/search?q=AI+2026</text>
    
    <!-- Embedded Content -->
    <rect x="12" y="48" width="426" height="355" rx="8" fill="#ffffff"/>
    
    <text x="25" y="80" fill="#4285F4" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18">Google</text>
    
    <text x="25" y="110" fill="#202124" font-family="sans-serif" font-size="10">https://deepmind.google › research</text>
    <text x="25" y="130" fill="#1a0dab" font-family="sans-serif" font-weight="bold" font-size="14">Frontier AI &amp; Next-Gen Autonomous Systems</text>
    <text x="25" y="150" fill="#4d5156" font-family="sans-serif" font-size="11">DeepMind researchers announce state of the art reasoning...</text>
    <rect x="25" y="165" width="90" height="22" rx="4" fill="#e8f0fe"/>
    <text x="35" y="180" fill="#1a73e8" font-family="sans-serif" font-weight="bold" font-size="10">Read In-App</text>
    
    <line x1="25" y1="200" x2="410" y2="200" stroke="#eeeeee"/>

    <text x="25" y="225" fill="#202124" font-family="sans-serif" font-size="10">https://arxiv.org › abs › 2608.0419</text>
    <text x="25" y="245" fill="#1a0dab" font-family="sans-serif" font-weight="bold" font-size="14">Self-Evolving Agent Loops &amp; Swarm Tool Use</text>
    <text x="25" y="265" fill="#4d5156" font-family="sans-serif" font-size="11">A comprehensive survey of autonomous desktop orchestration...</text>
    
    <rect x="25" y="295" width="390" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="320" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="12">Zero-Tab Browsing Active</text>
    <text x="40" y="340" fill="#64748b" font-family="sans-serif" font-size="11">Explore full websites directly inside V.A.N.I-xAI console without exiting.</text>
  </g>

  <!-- Bottom Home Indicator -->
  <rect x="180" y="775" width="140" height="5" rx="2.5" fill="#475569"/>
</svg>
