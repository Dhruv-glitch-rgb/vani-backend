<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security PIN - V.A.N.I-xAI</title>
    <link rel="shortcut icon" href="vani_icon.png" type="image/x-icon">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <style>
        :root {
            --accent-primary: #0284c7;
            --accent-secondary: #7c3aed;
            --accent-pink: #ec4899;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --error-color: #ef4444;
            --success-color: #10b981;
            --text-main: #0f172a;
            --text-dim: #475569;
        }

        body.light-theme {
            background: #f8faff !important;
            color: #0f172a !important;
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Colorful Floating Mesh Blobs */
        .ambient-core {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.42;
            animation: floatGlow 14s infinite alternate ease-in-out;
        }
        .pin-glow-1 { top: -10%; left: -8%; width: 500px; height: 500px; background: radial-gradient(circle, #fcd34d 0%, rgba(245, 158, 11, 0.4) 45%, transparent 70%); }
        .pin-glow-2 { top: 10%; right: -8%; width: 520px; height: 520px; background: radial-gradient(circle, #38bdf8 0%, rgba(2, 132, 199, 0.4) 45%, transparent 70%); animation-delay: -3.5s; }
        .pin-glow-3 { bottom: -10%; left: 10%; width: 540px; height: 540px; background: radial-gradient(circle, #f472b6 0%, rgba(236, 72, 153, 0.35) 45%, transparent 70%); animation-delay: -7s; }
        .pin-glow-4 { bottom: 5%; right: 10%; width: 480px; height: 480px; background: radial-gradient(circle, #34d399 0%, rgba(16, 185, 129, 0.35) 45%, transparent 70%); animation-delay: -10s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, 25px) scale(1.08); }
            100% { transform: translate(-30px, -20px) scale(0.95); }
        }

        /* Grid */
        .texture-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(14, 165, 233, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
        }

        /* Glass Container Override */
        .pin-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 440px;
            padding: 40px 32px 32px;
            text-align: center;
            background: rgba(255, 255, 255, 0.88) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(124, 58, 237, 0.12), 0 0 35px rgba(14, 165, 233, 0.18), 0 10px 30px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
            box-sizing: border-box;
        }

        .pin-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3.5px;
            background: linear-gradient(90deg, #f43f5e, #ec4899, #a855f7, #3b82f6, #06b6d4, #10b981, #f59e0b);
            background-size: 200% 100%;
            animation: rainbowBar 4s linear infinite;
        }

        @keyframes rainbowBar {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        @keyframes slideUpFade {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Header */
        .auth-logo {
            width: 72px;
            margin-bottom: 14px;
            border-radius: 20px;
            border: 2px solid rgba(2, 132, 199, 0.4);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.25), 0 0 15px rgba(236, 72, 153, 0.2);
            background: #ffffff;
            padding: 4px;
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #0284c7 0%, #7c3aed 50%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            color: #475569;
            font-size: 0.9rem;
            margin: 0 0 22px 0;
            font-weight: 500;
            line-height: 1.4;
        }

        /* PIN Display Area */
        .pin-display {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 22px;
            min-height: 22px;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: #f1f5f9;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pin-dot.filled {
            background: linear-gradient(135deg, #0284c7 0%, #ec4899 100%);
            border-color: #0284c7;
            box-shadow: 0 0 14px rgba(2, 132, 199, 0.55), 0 0 8px rgba(236, 72, 153, 0.4);
            transform: scale(1.15);
        }
        
        .pin-dot.error {
            background: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Invisible Input for Desktop Keyboard */
        #hidden-pin-input {
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
        }

        /* Interactive NumPad */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            justify-content: center;
            max-width: 320px;
            margin: 0 auto;
        }

        .desktop-hint {
            display: none;
            margin-top: 14px;
            margin-bottom: 0;
            color: #64748b;
            font-size: 0.82rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
        }

        @media (min-width: 769px) {
            .numpad {
                display: none;
            }
            .desktop-hint {
                display: block;
            }
        }

        .num-btn {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            color: #0f172a;
            font-size: 1.45rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            cursor: pointer;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
        }

        .num-btn:hover {
            transform: translateY(-2px);
            border-color: #0284c7;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.2);
            color: #0284c7;
        }

        .num-btn:active, .num-btn.active {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.15), rgba(236, 72, 153, 0.15));
            border-color: #0284c7;
            box-shadow: 0 0 16px rgba(2, 132, 199, 0.35);
            transform: scale(0.95);
        }
        
        .num-btn.action {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            font-size: 1.25rem;
            color: #64748b;
        }
        .num-btn.action:hover {
            border-color: #ec4899;
            color: #ec4899;
        }

        .msg-text {
            margin-top: 14px;
            min-height: 20px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #0284c7;
            transition: all 0.2s ease;
        }
        
        .msg-error {
            color: #e11d48 !important;
        }

        .loading-spinner {
            display: none;
            margin: 20px auto;
            width: 34px; height: 34px;
            border: 3px solid rgba(2, 132, 199, 0.15);
            border-top: 3px solid #0284c7;
            border-right: 3px solid #ec4899;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Dark mode overrides */
        body.dark-mode {
            --bg-main: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.9);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            background-color: var(--bg-main) !important;
            color: var(--text-primary) !important;
        }
        body.dark-mode .pin-container {
            background: rgba(15, 23, 42, 0.92) !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5), 0 0 35px rgba(2, 132, 199, 0.2);
        }
        body.dark-mode p.subtitle, body.dark-mode .desktop-hint {
            color: #94a3b8 !important;
        }
        body.dark-mode .num-btn {
            background: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        body.dark-mode .num-btn:hover {
            border-color: #38bdf8 !important;
            color: #38bdf8 !important;
        }
        body.dark-mode .num-btn.action {
            background: #0f172a !important;
            color: #94a3b8 !important;
        }
        body.dark-mode .pin-dot {
            background: #334155;
            border-color: #475569;
        }
        body.dark-mode #forgot-card-box {
            background: rgba(30, 41, 59, 0.8) !important;
            border-color: rgba(2, 132, 199, 0.35) !important;
        }
        body.dark-mode #forgot-email-badge {
            background: rgba(15, 23, 42, 0.7) !important;
            color: #cbd5e1 !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        body.dark-mode #forgot-account-pass {
            background: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        body.dark-mode #btn-verify-google {
            background: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }

    </style>
</head>
<body class="light-theme" style="height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; margin: 0;">

    <div class="ambient-core pin-glow-1"></div>
    <div class="ambient-core pin-glow-2"></div>
    <div class="ambient-core pin-glow-3"></div>
    <div class="ambient-core pin-glow-4"></div>
    <div class="texture-grid"></div>

    <div class="pin-container glass-panel">
        <img src="/bureau_logo.png" class="auth-logo" alt="Bureau of V.A.N.I-xAI" onerror="this.src='vani_logo.jpg'">
        <h2 id="pin-title">Security Gateway</h2>
        <p class="subtitle" id="pin-subtitle">Authenticating session...</p>
        
        <div class="loading-spinner" id="loading-spinner"></div>

        <!-- Length Selection Area -->
        <div id="length-selection-area" style="display: none; margin-bottom: 20px;">
            <p style="margin-bottom: 16px; color: var(--accent-primary); font-weight: 600; font-size: 0.95rem;">Select PIN Length:</p>
            <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 18px;">
                <button class="num-btn" style="font-size:1.2rem; width: 62px; height:62px;" onclick="selectPinLength(4)">4</button>
                <button class="num-btn" style="font-size:1.2rem; width: 62px; height:62px;" onclick="selectPinLength(6)">6</button>
                <button class="num-btn" style="font-size:1.2rem; width: 62px; height:62px;" onclick="selectPinLength(8)">8</button>
            </div>
            <button id="btn-cancel-length" onclick="cancelLengthSelection()" style="background: none; border: none; color: #64748b; font-size: 0.84rem; font-weight: 600; cursor: pointer; display: none; padding: 6px 12px;">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
        </div>

        <!-- Interactive PIN Area -->
        <div id="pin-interaction-area" style="display: none;">
            <!-- PIN Dots -->
            <div class="pin-display" id="pin-dots">
                <!-- Dots generated dynamically via JS -->
            </div>

            <!-- Hidden input to capture keyboard events on Desktop -->
            <input type="password" id="hidden-pin-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">

            <!-- Mobile NumPad -->
            <div class="numpad" id="numpad">
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
                <button class="num-btn action" id="btn-clear" title="Clear"><i class="fa-solid fa-xmark"></i></button>
                <button class="num-btn" data-num="0">0</button>
                <button class="num-btn action" id="btn-backspace" title="Delete"><i class="fa-solid fa-delete-left"></i></button>
            </div>

            <p class="desktop-hint">Please use your keyboard to enter the PIN</p>

            <div class="msg-text" id="status-msg"></div>

            <!-- Action & Recovery Navigation -->
            <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center;">
                <button id="btn-forgot-pin" onclick="openForgotPinModal()" type="button" style="background: none; border: none; color: #0284c7; font-size: 0.88rem; font-weight: 600; cursor: pointer; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s;">
                    <i class="fa-solid fa-circle-question"></i> Forgot PIN?
                </button>

                <div id="reset-action-buttons" style="display: flex; gap: 8px; justify-content: center; width: 100%; flex-wrap: wrap;">
                    <button id="btn-back-to-settings" onclick="backToSettings()" type="button" style="display: none; background: rgba(2, 132, 199, 0.08); color: #0284c7; border: 1.2px solid rgba(2, 132, 199, 0.3); padding: 8px 16px; border-radius: 12px; font-size: 0.82rem; font-weight: 700; cursor: pointer;">
                        <i class="fa-solid fa-arrow-left"></i> Return to Settings
                    </button>
                    <button id="btn-signout-pin" onclick="signOutFromPinPage()" style="background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(244, 63, 94, 0.15)); color: #e11d48; border: 1.2px solid rgba(244, 63, 94, 0.35); padding: 8px 16px; border-radius: 12px; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.25s;" title="Sign Out of this account">
                        <i class="fa-solid fa-right-from-bracket"></i> Sign Out / Switch Account
                    </button>
                </div>
            </div>
        </div>

        <!-- Identity Verification / Forgot PIN Area -->
        <div id="forgot-pin-area" style="display: none; margin-top: 10px; text-align: left;">
            <div id="forgot-card-box" style="background: rgba(2, 132, 199, 0.05); border: 1.5px solid rgba(2, 132, 199, 0.2); border-radius: 20px; padding: 22px; margin-bottom: 14px;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <div style="width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #7c3aed); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.05rem; flex-shrink: 0;">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div>
                        <h3 style="font-size: 1.05rem; color: #0284c7; margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700;">Account Verification</h3>
                        <p id="forgot-auth-subtitle" style="font-size: 0.82rem; color: #64748b; margin: 2px 0 0 0;">Verify your identity to reset your PIN</p>
                    </div>
                </div>

                <div id="forgot-email-badge" style="font-size: 0.82rem; font-weight: 600; color: #334155; margin-bottom: 14px; padding: 6px 12px; background: rgba(255,255,255,0.8); border-radius: 8px; border: 1px solid #e2e8f0; word-break: break-all;">
                    <i class="fa-regular fa-envelope" style="color: #0284c7; margin-right: 6px;"></i><span id="forgot-user-email">user@email.com</span>
                </div>

                <!-- For Password Accounts -->
                <div id="forgot-password-box" style="display: none;">
                    <div style="position: relative; margin-bottom: 12px;">
                        <input type="password" id="forgot-account-pass" placeholder="Enter account password" 
                            style="width: 100%; box-sizing: border-box; padding: 11px 40px 11px 12px; border-radius: 12px; border: 1.5px solid #cbd5e1; font-size: 0.9rem; outline: none; background: #ffffff; color: #0f172a;">
                        <i class="fa-regular fa-eye-slash" id="toggle-forgot-pw" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; font-size: 0.95rem;"></i>
                    </div>
                    <button id="btn-verify-password" onclick="verifyPasswordForReset()" style="width: 100%; padding: 11px; background: linear-gradient(135deg, #0284c7, #7c3aed); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.88rem; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25); transition: opacity 0.2s;">
                        Verify Password &amp; Reset PIN
                    </button>
                    <div style="text-align: center; margin-top: 10px;">
                        <a href="#" id="btn-send-reset-email" onclick="sendResetEmail(event)" style="font-size: 0.8rem; color: #0284c7; text-decoration: none; font-weight: 600;">
                            <i class="fa-regular fa-paper-plane"></i> Send password reset link to email
                        </a>
                    </div>
                </div>

                <!-- For Google Accounts -->
                <div id="forgot-google-box" style="display: none; text-align: center;">
                    <p style="font-size: 0.84rem; color: #475569; margin: 0 0 14px 0; line-height: 1.4;">
                        Your account is linked to Google. Confirm your Google login to reset your PIN.
                    </p>
                    <button id="btn-verify-google" onclick="verifyGoogleForReset()" style="width: 100%; padding: 11px; background: #ffffff; color: #1e293b; border: 1.5px solid #cbd5e1; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.88rem; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.06); transition: border-color 0.2s;">
                        <svg width="18" height="18" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Verify with Google
                    </button>
                </div>

                <div id="forgot-status-msg" class="msg-text" style="margin-top: 10px; font-size: 0.82rem;"></div>
            </div>

            <button id="btn-cancel-forgot" onclick="closeForgotPinModal()" style="width: 100%; background: none; border: none; color: #64748b; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 6px;">
                <i class="fa-solid fa-arrow-left"></i> Cancel &amp; Return
            </button>
        </div>
    </div>

    <!-- Firebase SDK -->

            projectId: "vani-nzdrsr",

        let mode = 'check'; // 'check', 'setup', 'verify', 'reset_verify'

        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');

        function signOutFromPinPage() {
            if (confirm("Are you sure you want to sign out?")) {
                auth.signOut().then(() => {
                    localStorage.removeItem('vani_session_token');
                    sessionStorage.removeItem('pin_verified');
                    window.location.href = '/auth-vani-xai.html';
                }).catch(() => {
                    window.location.href = '/auth-vani-xai.html';
                });
            }
        }

        function backToSettings() {
            window.location.href = './settings.html';
        }

        // Show/Hide Loading
        function setLoading(isLoading) {
            spinner.style.display = isLoading ? 'block' : 'none';
            if (isLoading) {
                interactionArea.style.display = 'none';
                lengthSelectionArea.style.display = 'none';
                forgotArea.style.display = 'none';
            }
            if (!isLoading && !isLockedOut && interactionArea.style.display !== 'none') {
                hiddenInput.focus();
            }
        }
        
        let failedAttempts = 0;
        let isLockedOut = false;
        let lockoutTimerInterval = null;

        function startLockoutTimer(lockoutUntilDate) {
            isLockedOut = true;
            setLoading(false);
            interactionArea.style.display = 'block';
            dotsContainer.style.display = 'none';
            document.getElementById('numpad').style.display = 'none';
            hiddenInput.disabled = true;
            btnForgotPin.style.display = 'inline-flex';
            
            clearInterval(lockoutTimerInterval);
            
            const updateTimer = () => {
                const now = new Date();
                const diffMs = lockoutUntilDate - now;
                if (diffMs <= 0) {
                    clearInterval(lockoutTimerInterval);
                    isLockedOut = false;
                    dotsContainer.style.display = 'flex';
                    document.getElementById('numpad').style.display = 'grid';
                    hiddenInput.disabled = false;
                    statusMsg.textContent = 'You may try again.';
                    statusMsg.className = 'msg-text';
                    currentPin = '';
                    updateDots();
                    hiddenInput.focus();
                } else {
                    const secondsLeft = Math.ceil(diffMs / 1000);
                    statusMsg.textContent = `Too many incorrect attempts. Try again in ${secondsLeft}s or use Forgot PIN.`;
                    statusMsg.className = 'msg-text msg-error';
                }
            };
            
            updateTimer();
            lockoutTimerInterval = setInterval(updateTimer, 1000);
        }

        // Draw Dots
        function drawDots(length) {
            dotsContainer.innerHTML = '';
            for(let i = 0; i < length; i++) {
                const dot = document.createElement('div');
                dot.className = 'pin-dot';
                dotsContainer.appendChild(dot);
            }
        }

        // Update Dots UI based on input
        function updateDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('filled');
                    dot.classList.remove('error');
                } else {
                    dot.classList.remove('filled', 'error');
                }
            });
            hiddenInput.value = currentPin;

            // Auto-advance / submit logic based on mode
            if (mode === 'setup') {
                if (setupStep === 'enter') {
                    if (currentPin.length === maxPinLength) {
                        newPinTemp = currentPin;
                        setTimeout(() => {
                            currentPin = '';
                            setupStep = 'confirm';
                            titleEl.textContent = 'Confirm Your PIN';
                            subtitleEl.innerHTML = `Re-enter your <b>${maxPinLength}</b>-digit PIN to confirm`;
                            statusMsg.textContent = '';
                            statusMsg.className = 'msg-text';
                            drawDots(maxPinLength);
                            updateDots();
                            hiddenInput.value = '';
                            hiddenInput.focus();
                        }, 200);
                    }
                } else if (setupStep === 'confirm') {
                    if (currentPin.length === maxPinLength) {
                        if (currentPin === newPinTemp) {
                            savePin(currentPin);
                        } else {
                            statusMsg.textContent = "PINs do not match. Please try again.";
                            statusMsg.className = 'msg-text msg-error';
                            triggerError();
                            setTimeout(() => {
                                currentPin = '';
                                newPinTemp = '';
                                setupStep = 'enter';
                                titleEl.textContent = (action === 'reset' || hasExistingPin) ? 'Create New PIN' : 'Create Security PIN';
                                subtitleEl.innerHTML = `Set your <b>${maxPinLength}</b>-digit security PIN`;
                                statusMsg.textContent = '';
                                drawDots(maxPinLength);
                                updateDots();
                                hiddenInput.value = '';
                                hiddenInput.focus();
                            }, 600);
                        }
                    }
                }
            } else if (mode === 'verify' || mode === 'reset_verify') {
                if (currentPin.length === expectedPin.length) {
                    verifyPin();
                }
            }
        }

        function triggerError() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach(dot => dot.classList.add('error'));
            setTimeout(() => {
                currentPin = '';
                updateDots();
            }, 500);
        }

        // --- Logic Handlers ---

        async function logActivity(msg) {
            try {
                if (currentUser) {
                    await db.collection('logs').add({
                        activity: msg,
                        email: currentUser.email || 'Unknown',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            } catch(e) { console.error("Logging error:", e); }
        }

        async function verifyPin() {
            if (currentPin === expectedPin) {
                if (mode === 'reset_verify') {
                    // Transition smoothly to setup new PIN mode
                    mode = 'setup';
                    setupStep = 'enter';
                    currentPin = '';
                    newPinTemp = '';
                    hiddenInput.value = '';
                    statusMsg.textContent = '';
                    interactionArea.style.display = 'none';
                    lengthSelectionArea.style.display = 'block';
                    btnCancelLength.style.display = 'inline-block';
                    titleEl.textContent = 'Setup New Security PIN';
                    subtitleEl.innerHTML = 'Choose how long you want your new PIN to be:';

                    if (failedAttempts > 0) {
                        db.collection('users').doc(currentUser.uid).update({ failedAttempts: 0, lockoutUntil: firebase.firestore.FieldValue.delete() }).catch(console.error);
                        failedAttempts = 0;
                    }
                    return;
                } else {
                    statusMsg.textContent = "Access Granted.";
                    statusMsg.className = 'msg-text';
                    sessionStorage.setItem('pin_verified', 'true');
                    
                    // Reset failed attempts on success
                    if (failedAttempts > 0) {
                        db.collection('users').doc(currentUser.uid).update({ failedAttempts: 0, lockoutUntil: firebase.firestore.FieldValue.delete() }).catch(console.error);
                        failedAttempts = 0;
                    }

                    await logActivity("Security PIN Verified");
                    setTimeout(() => window.location.href = './login-loading-vaniXai.html', 500);
                }
            } else {
                failedAttempts++;
                statusMsg.textContent = "Incorrect PIN.";
                statusMsg.className = 'msg-text msg-error';
                
                try {
                    let lockoutDuration = 0;
                    if (failedAttempts === 2) lockoutDuration = 10000;
                    else if (failedAttempts >= 3) lockoutDuration = 40000;

                    let updateData = { failedAttempts: failedAttempts };
                    
                    if (lockoutDuration > 0) {
                        const lockoutUntil = new Date(Date.now() + lockoutDuration);
                        updateData.lockoutUntil = lockoutUntil;
                        await db.collection('users').doc(currentUser.uid).update(updateData);
                        startLockoutTimer(lockoutUntil);
                    } else {
                        await db.collection('users').doc(currentUser.uid).update(updateData);
                        triggerError();
                    }
                } catch(e) {
                    console.error("Error updating failed attempts", e);
                    triggerError();
                }
            }
        }

        async function savePin(pinToSave) {
            const targetPin = pinToSave || currentPin;
            if (targetPin.length !== 4 && targetPin.length !== 6 && targetPin.length !== 8) {
                statusMsg.textContent = "PIN must be exactly 4, 6, or 8 digits.";
                statusMsg.className = 'msg-text msg-error';
                triggerError();
                return;
            }

            setLoading(true);
            try {
                await db.collection('users').doc(currentUser.uid).set({
                    email: currentUser.email,
                    name: currentUser.displayName || currentUser.email.split('@')[0],
                    pin: targetPin,
                    failedAttempts: 0,
                    lockoutUntil: firebase.firestore.FieldValue.delete(),
                    pinUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                statusMsg.textContent = (action === 'reset' || hasExistingPin) ? "Security PIN reset successfully!" : "Security PIN configured successfully!";
                statusMsg.className = 'msg-text';
                sessionStorage.setItem('pin_verified', 'true');
                await logActivity(action === 'reset' || hasExistingPin ? "Security PIN Reset Successfully" : "Security PIN Configured");
                
                setTimeout(() => {
                    if (action === 'reset') {
                        window.location.href = './settings.html';
                    } else {
                        window.location.href = './login-loading-vaniXai.html';
                    }
                }, 600);
            } catch (err) {
                console.error("Error saving PIN:", err);
                statusMsg.textContent = "Error saving PIN. Please try again.";
                statusMsg.className = 'msg-text msg-error';
                setLoading(false);
            }
        }

        // --- Forgot PIN & Account Verification ---

        function openForgotPinModal() {
            interactionArea.style.display = 'none';
            lengthSelectionArea.style.display = 'none';
            forgotArea.style.display = 'block';
            titleEl.textContent = 'Account Verification';
            subtitleEl.textContent = 'Verify identity to reset your security PIN';
            
            const emailSpan = document.getElementById('forgot-user-email');
            const passBox = document.getElementById('forgot-password-box');
            const googleBox = document.getElementById('forgot-google-box');
            const forgotMsg = document.getElementById('forgot-status-msg');
            forgotMsg.textContent = '';
            forgotMsg.className = 'msg-text';
            
            if (currentUser) {
                emailSpan.textContent = currentUser.email || 'Current Account';
                const isGoogle = currentUser.providerData && currentUser.providerData.some(p => p.providerId === 'google.com');
                if (isGoogle) {
                    googleBox.style.display = 'block';
                    passBox.style.display = 'none';
                } else {
                    passBox.style.display = 'block';
                    googleBox.style.display = 'none';
                    const passInput = document.getElementById('forgot-account-pass');
                    passInput.value = '';
                    setTimeout(() => passInput.focus(), 200);
                }
            }
        }

        function closeForgotPinModal() {
            forgotArea.style.display = 'none';
            if (mode === 'setup') {
                lengthSelectionArea.style.display = 'block';
                titleEl.textContent = 'Setup Security PIN';
                subtitleEl.innerHTML = 'Choose your PIN length:';
            } else {
                interactionArea.style.display = 'block';
                if (mode === 'reset_verify') {
                    titleEl.textContent = 'Reset Security PIN';
                    subtitleEl.textContent = 'Enter your CURRENT PIN to verify identity';
                } else {
                    titleEl.textContent = 'Enter Security PIN';
                    subtitleEl.textContent = 'Please verify your identity to continue';
                }
                if (!isLockedOut) hiddenInput.focus();
            }
        }

        async function verifyPasswordForReset() {
            const passInput = document.getElementById('forgot-account-pass');
            const forgotMsg = document.getElementById('forgot-status-msg');
            const pass = passInput.value.trim();
            if (!pass) {
                forgotMsg.textContent = 'Please enter your password.';
                forgotMsg.className = 'msg-text msg-error';
                return;
            }

            forgotMsg.textContent = 'Verifying password...';
            forgotMsg.className = 'msg-text';
            
            try {
                const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, pass);
                await currentUser.reauthenticateWithCredential(cred);
                
                // Clear lockout & reset attempts
                isLockedOut = false;
                clearInterval(lockoutTimerInterval);
                failedAttempts = 0;
                await db.collection('users').doc(currentUser.uid).update({
                    failedAttempts: 0,
                    lockoutUntil: firebase.firestore.FieldValue.delete()
                }).catch(console.error);

                forgotMsg.textContent = 'Identity verified! Redirecting to PIN setup...';
                await logActivity("Identity Verified for PIN Reset via Password");

                setTimeout(() => {
                    forgotArea.style.display = 'none';
                    mode = 'setup';
                    setupStep = 'enter';
                    currentPin = '';
                    newPinTemp = '';
                    lengthSelectionArea.style.display = 'block';
                    btnCancelLength.style.display = 'none';
                    titleEl.textContent = 'Reset Security PIN';
                    subtitleEl.innerHTML = 'Identity verified! Choose your new PIN length:';
                }, 500);
            } catch (err) {
                console.error("Re-auth error:", err);
                forgotMsg.textContent = err.code === 'auth/wrong-password' ? 'Incorrect password. Please try again.' : (err.message || 'Verification failed.');
                forgotMsg.className = 'msg-text msg-error';
            }
        }

        async function verifyGoogleForReset() {
            const forgotMsg = document.getElementById('forgot-status-msg');
            forgotMsg.textContent = 'Connecting to Google...';
            forgotMsg.className = 'msg-text';

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                await currentUser.reauthenticateWithPopup(provider);

                // Clear lockout & reset attempts
                isLockedOut = false;
                clearInterval(lockoutTimerInterval);
                failedAttempts = 0;
                await db.collection('users').doc(currentUser.uid).update({
                    failedAttempts: 0,
                    lockoutUntil: firebase.firestore.FieldValue.delete()
                }).catch(console.error);

                forgotMsg.textContent = 'Google verified! Redirecting to PIN setup...';
                await logActivity("Identity Verified for PIN Reset via Google");

                setTimeout(() => {
                    forgotArea.style.display = 'none';
                    mode = 'setup';
                    setupStep = 'enter';
                    currentPin = '';
                    newPinTemp = '';
                    lengthSelectionArea.style.display = 'block';
                    btnCancelLength.style.display = 'none';
                    titleEl.textContent = 'Reset Security PIN';
                    subtitleEl.innerHTML = 'Identity verified! Choose your new PIN length:';
                }, 500);
            } catch (err) {
                console.error("Google re-auth error:", err);
                if (err.code !== 'auth/popup-closed-by-user') {
                    forgotMsg.textContent = err.message || 'Google verification failed.';
                    forgotMsg.className = 'msg-text msg-error';
                } else {
                    forgotMsg.textContent = '';
                }
            }
        }

        async function sendResetEmail(e) {
            e.preventDefault();
            const forgotMsg = document.getElementById('forgot-status-msg');
            forgotMsg.textContent = 'Sending reset email...';
            forgotMsg.className = 'msg-text';
            try {
                await auth.sendPasswordResetEmail(currentUser.email);
                forgotMsg.textContent = `Password reset link sent to ${currentUser.email}. Check your inbox.`;
                forgotMsg.className = 'msg-text';
            } catch (err) {
                console.error("Reset email error:", err);
                forgotMsg.textContent = err.message || 'Failed to send reset email.';
                forgotMsg.className = 'msg-text msg-error';
            }
        }

        // Toggle Password Eye in Forgot PIN Modal
        const toggleForgotPw = document.getElementById('toggle-forgot-pw');
        if (toggleForgotPw) {
            toggleForgotPw.addEventListener('click', () => {
                const pInput = document.getElementById('forgot-account-pass');
                if (pInput.type === 'password') {
                    pInput.type = 'text';
                    toggleForgotPw.classList.replace('fa-eye-slash', 'fa-eye');
                } else {
                    pInput.type = 'password';
                    toggleForgotPw.classList.replace('fa-eye', 'fa-eye-slash');
                }
            });
        }

        const forgotPassInput = document.getElementById('forgot-account-pass');
        if (forgotPassInput) {
            forgotPassInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    verifyPasswordForReset();
                }
            });
        }

        // --- Event Listeners ---

        // Screen Keyboard / Buttons
        document.querySelectorAll('.num-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if(btn.dataset.num) {
                    if (currentPin.length < maxPinLength) {
                        currentPin += btn.dataset.num;
                        updateDots();
                    }
                }
            });
        });

        document.getElementById('btn-backspace').addEventListener('click', () => {
            currentPin = currentPin.slice(0, -1);
            updateDots();
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            currentPin = '';
            updateDots();
        });

        // Desktop Physical Keyboard via Hidden Input
        hiddenInput.addEventListener('input', (e) => {
            const val = e.target.value.replace(/[^0-9]/g, '');
            currentPin = val.slice(0, maxPinLength);
            updateDots();
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (mode === 'setup') {
                    if (setupStep === 'enter' && currentPin.length === maxPinLength) {
                        newPinTemp = currentPin;
                        currentPin = '';
                        setupStep = 'confirm';
                        titleEl.textContent = 'Confirm New PIN';
                        subtitleEl.innerHTML = `Re-enter your <b>${maxPinLength}</b>-digit PIN to confirm`;
                        drawDots(maxPinLength);
                        updateDots();
                        hiddenInput.value = '';
                    } else if (setupStep === 'confirm' && currentPin.length === maxPinLength) {
                        if (currentPin === newPinTemp) {
                            savePin(currentPin);
                        } else {
                            statusMsg.textContent = "PINs do not match. Please try again.";
                            statusMsg.className = 'msg-text msg-error';
                            triggerError();
                        }
                    }
                } else if (mode === 'verify' || mode === 'reset_verify') {
                    if (currentPin.length > 0) verifyPin();
                }
            }
        });

        // Force focus on click anywhere when interaction area is active
        document.addEventListener('click', (e) => {
            if (interactionArea.style.display !== 'none' && !isLockedOut) {
                if (!e.target.closest('#forgot-pin-area') && !e.target.closest('#btn-forgot-pin') && !e.target.closest('#btn-back-to-settings') && !e.target.closest('#btn-signout-pin')) {
                    hiddenInput.focus();
                }
            }
        });

        function selectPinLength(len) {
            maxPinLength = len;
            currentPin = '';
            newPinTemp = '';
            setupStep = 'enter';
            mode = 'setup';
            lengthSelectionArea.style.display = 'none';
            interactionArea.style.display = 'block';
            titleEl.textContent = (action === 'reset' || hasExistingPin) ? 'Create New PIN' : 'Create Security PIN';
            subtitleEl.innerHTML = `Set your <b>${len}</b> digit security PIN`;
            statusMsg.textContent = '';
            statusMsg.className = 'msg-text';
            drawDots(len);
            updateDots();
            hiddenInput.value = '';
            hiddenInput.focus();
        }

        function cancelLengthSelection() {
            lengthSelectionArea.style.display = 'none';
            if (action === 'reset' && hasExistingPin) {
                mode = 'reset_verify';
                titleEl.textContent = 'Reset Security PIN';
                subtitleEl.textContent = 'Enter your CURRENT PIN to verify identity';
                interactionArea.style.display = 'block';
                currentPin = '';
                drawDots(expectedPin.length);
                updateDots();
                hiddenInput.focus();
            } else {
                window.location.href = './settings.html';
            }
        }

        // --- Main Auth Flow ---
        
        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                setLoading(true);
                
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        const data = doc.data();
                        const idName = data.name ? encodeURIComponent(data.name.replace(/ /g, '-')) : 'User';
                        
                        // Check if account is activated with sovereign BoVxAi key
                        if (data.isActivated !== true && data.activationKeyVerified !== true) {
                            window.location.href = './activation-vaniXai.html';
                            return;
                        }
                        
                        // Check if banned
                        if (data.status === 'banned') {
                            window.location.href = `/${idName}/banned-by-vani-xai0419`;
                            return;
                        }
                        
                        // Check if blocked
                        if (data.status === 'blocked' && data.unblockTime) {
                            const unblockDate = data.unblockTime.toDate();
                            if (unblockDate > new Date()) {
                                window.location.href = `/${idName}/blocked-by-vani-xai0419`;
                                return;
                            } else {
                                // Block expired, reset status
                                await db.collection('users').doc(user.uid).update({ status: firebase.firestore.FieldValue.delete(), unblockTime: firebase.firestore.FieldValue.delete(), blockReason: firebase.firestore.FieldValue.delete() });
                            }
                        }

                        if (data.pin) {
                            hasExistingPin = true;
                            expectedPin = doc.data().pin;
                            maxPinLength = expectedPin.length;

                            if (action === 'reset') {
                                // User wants to reset -> Reset Verify Mode
                                mode = 'reset_verify';
                                titleEl.textContent = 'Reset Security PIN';
                                subtitleEl.textContent = 'Enter your CURRENT PIN to verify identity';
                                btnBackSettings.style.display = 'inline-block';
                                btnForgotPin.style.display = 'inline-flex';
                                drawDots(maxPinLength);
                                setLoading(false);
                                interactionArea.style.display = 'block';
                                hiddenInput.focus();
                            } else {
                                // Normal Login -> Verify Mode
                                mode = 'verify';
                                titleEl.textContent = 'Enter Security PIN';
                                subtitleEl.textContent = 'Please verify your identity to continue';
                                btnForgotPin.style.display = 'inline-flex';
                                
                                failedAttempts = data.failedAttempts || 0;
                                
                                if (data.lockoutUntil) {
                                    const lockoutUntil = data.lockoutUntil.toDate();
                                    if (lockoutUntil > new Date()) {
                                        startLockoutTimer(lockoutUntil);
                                        drawDots(maxPinLength);
                                        return;
                                    }
                                }
                                
                                drawDots(maxPinLength);
                                setLoading(false);
                                interactionArea.style.display = 'block';
                                hiddenInput.focus();
                            }
                        }
                    }
                    
                    if (!doc.exists || !doc.data().pin) {
                        // User has no PIN -> Setup Mode (Show Length Selection First)
                        hasExistingPin = false;
                        mode = 'setup';
                        setupStep = 'enter';
                        titleEl.textContent = 'Setup Security PIN';
                        subtitleEl.innerHTML = 'First, select how long you want your PIN to be.';
                        btnForgotPin.style.display = 'none';
                        setLoading(false);
                        interactionArea.style.display = 'none';
                        lengthSelectionArea.style.display = 'block';
                    }
                } catch (error) {
                    console.error("Firestore error:", error);
                    subtitleEl.textContent = "Database connection error.";
                }
            } else {
                window.location.href = '/auth-vani-xai.html';
            }
        });

    </script>

<button class="dark-mode-toggle-btn" id="darkModeToggle" aria-label="Toggle Dark Mode">
  <span id="darkModeIcon">🌙</span>
</button>
<script>
  (function() {
    const toggleBtn = document.getElementById('darkModeToggle');
    const body = document.body;
    const icon = document.getElementById('darkModeIcon');
    
    // Check local storage for theme preference
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
      icon.textContent = '☀️';
    }
    
    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
        icon.textContent = '☀️';
      } else {
        localStorage.setItem('theme', 'light');
        icon.textContent = '🌙';
      }
    });
  })();
</script>
