<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V.A.N.I-xAI (BoVxAi) | National Children's Science Congress (NCSC) Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg-canvas: #f1f5f9;
    --slide-bg: #ffffff;
    --navy-primary: #0f2744;
    --royal-blue: #1d4ed8;
    --sky-blue: #0284c7;
    --cyan-accent: #06b6d4;
    --emerald: #059669;
    --emerald-light: #ecfdf5;
    --gold: #d97706;
    --gold-light: #fef3c7;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --rose: #e11d48;
    --rose-light: #fff1f2;
    --slate-dark: #0f172a;
    --slate-body: #334155;
    --slate-muted: #64748b;
    --card-border: #e2e8f0;
    --card-bg-soft: #f8fafc;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    background: #0f172a;
    font-family: 'Outfit', sans-serif;
    color: var(--slate-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Presentation Top Header Toolbar */
  .pres-header {
    background: #1e293b;
    color: #ffffff;
    padding: 10px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #334155;
    z-index: 100;
  }

  .pres-title {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .pres-title img {
    height: 32px;
    width: 32px;
    object-fit: contain;
    border-radius: 6px;
    background: #ffffff;
    padding: 2px;
  }

  .pres-title-text h1 {
    font-size: 15px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: 0.5px;
  }

  .pres-title-text p {
    font-size: 11px;
    color: #94a3b8;
  }

  .pres-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pres-btn {
    background: #334155;
    color: #ffffff;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    text-decoration: none;
  }

  .pres-btn:hover {
    background: #475569;
    transform: translateY(-1px);
  }

  .pres-btn.btn-gold {
    background: linear-gradient(135deg, #d97706, #f59e0b);
    color: #ffffff;
  }

  .pres-btn.btn-blue {
    background: linear-gradient(135deg, #1d4ed8, #0284c7);
    color: #ffffff;
  }

  /* Main Slide Stage */
  .stage-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  /* 16:9 Slide Canvas */
  .slide-viewport {
    width: 1200px;
    height: 675px;
    background: var(--slide-bg);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 34px 20px 34px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Slide Background Decor */
  .slide-mesh-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 95% 5%, rgba(2, 132, 199, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 5% 95%, rgba(5, 150, 105, 0.04) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .slide-content-wrap {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Slide Header */
  .slide-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .header-left {
    flex: 1;
  }

  .category-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .pill-blue { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
  .pill-green { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .pill-gold { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
  .pill-purple { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
  .pill-red { background: #ffe4e6; color: #be123c; border: 1px solid #fecdd3; }

  .slide-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 27px;
    font-weight: 800;
    color: var(--navy-primary);
    line-height: 1.15;
    letter-spacing: 0.5px;
  }

  .slide-subtitle {
    font-size: 12.5px;
    color: var(--slate-muted);
    font-weight: 500;
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ncsc-tag {
    background: #fffbeb;
    border: 1px solid var(--gold-light);
    color: #92400e;
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .bov-logo-mini {
    width: 32px;
    height: 32px;
    object-fit: contain;
    border-radius: 6px;
    border: 1px solid var(--card-border);
  }

  /* Slide Body Content */
  .slide-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Slide Footer */
  .slide-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 11px;
    color: var(--slate-muted);
  }

  .footer-project-id {
    font-weight: 600;
    color: var(--royal-blue);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .footer-counter {
    background: #f1f5f9;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 700;
    font-family: monospace;
    color: var(--slate-dark);
  }

  /* Grids & Cards */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
  .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }

  .light-card {
    background: #ffffff;
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 4px 12px rgba(15, 39, 68, 0.03);
    transition: all 0.2s ease;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .light-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(15, 39, 68, 0.07);
  }

  .card-accent-blue { border-top: 3.5px solid var(--royal-blue); }
  .card-accent-green { border-top: 3.5px solid var(--emerald); }
  .card-accent-gold { border-top: 3.5px solid var(--gold); }
  .card-accent-purple { border-top: 3.5px solid var(--purple); }
  .card-accent-red { border-top: 3.5px solid var(--rose); }

  .card-icon-wrap {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-bottom: 10px;
  }

  .icon-blue { background: #eff6ff; color: var(--royal-blue); }
  .icon-green { background: #ecfdf5; color: var(--emerald); }
  .icon-gold { background: #fffbeb; color: var(--gold); }
  .icon-purple { background: #faf5ff; color: var(--purple); }
  .icon-red { background: #fff1f2; color: var(--rose); }

  .card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--navy-primary);
    margin-bottom: 6px;
  }

  .card-desc {
    font-size: 11.5px;
    color: var(--slate-body);
    line-height: 1.45;
  }

  .card-list {
    list-style: none;
    margin-top: 6px;
  }

  .card-list li {
    font-size: 11px;
    color: var(--slate-body);
    margin-bottom: 5px;
    position: relative;
    padding-left: 14px;
    line-height: 1.35;
  }

  .card-list li::before {
    content: "•";
    color: var(--royal-blue);
    font-weight: bold;
    position: absolute;
    left: 0;
  }

  /* Hero Title Slide 1 Styling */
  .hero-slide {
    display: flex;
    flex-direction: column;
    height: 100%;
    justify-content: space-between;
  }

  .hero-top-banner {
    background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 50%, #eff6ff 100%);
    border: 1.5px solid #cbd5e1;
    border-top: 4px solid var(--royal-blue);
    border-radius: 14px;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 6px 20px rgba(15, 39, 68, 0.05);
  }

  .hero-left-content {
    flex: 1;
  }

  .hero-pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fffbeb;
    border: 1px solid var(--gold-border);
    padding: 4px 14px;
    border-radius: 20px;
    color: #92400e;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .hero-main-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 42px;
    font-weight: 800;
    color: var(--navy-primary);
    line-height: 1.1;
    letter-spacing: 1.5px;
  }

  .hero-main-title span {
    background: linear-gradient(135deg, #1d4ed8, #0284c7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-expansion {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--emerald);
    letter-spacing: 1.5px;
    margin: 2px 0 6px 0;
  }

  .hero-tagline {
    font-size: 12px;
    color: var(--slate-body);
    font-weight: 500;
    max-width: 90%;
  }

  .hero-logo-box {
    width: 105px;
    height: 105px;
    background: #ffffff;
    border-radius: 12px;
    border: 1.5px solid var(--gold-border);
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 6px;
  }

  .hero-logo-box img {
    max-width: 95%;
    max-height: 95%;
    object-fit: contain;
  }

  .hero-bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 14px;
  }

  /* Table Design for Benchmark */
  .custom-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--card-border);
  }

  .custom-table th {
    background: #0f2744;
    color: #ffffff;
    padding: 9px 12px;
    text-align: left;
    font-weight: 700;
    font-size: 11.5px;
    letter-spacing: 0.5px;
  }

  .custom-table th:last-child {
    background: #059669;
  }

  .custom-table td {
    padding: 8px 12px;
    border-bottom: 1px solid #f1f5f9;
    color: var(--slate-body);
  }

  .custom-table tr:nth-child(even) td {
    background: #f8fafc;
  }

  .custom-table tr td:last-child {
    background: #f0fdf4 !important;
    font-weight: 700;
    color: #065f46;
  }

  .custom-table tr td:first-child {
    font-weight: 700;
    color: var(--slate-dark);
  }

  /* Step Flow Component */
  .step-flow-card {
    background: #ffffff;
    border: 1.5px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    position: relative;
  }

  .step-num-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  /* Bottom Controls Carousel Bar */
  .pres-carousel-bar {
    background: #1e293b;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #334155;
    z-index: 100;
  }

  .nav-btn-group {
    display: flex;
    gap: 8px;
  }

  .nav-arrow-btn {
    background: #334155;
    color: #ffffff;
    border: 1px solid #475569;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: all 0.2s ease;
  }

  .nav-arrow-btn:hover:not(:disabled) {
    background: #0284c7;
    border-color: #0284c7;
  }

  .nav-arrow-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .thumbnails-scroller {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px;
    max-width: 65%;
  }

  .thumb-pill {
    background: #334155;
    color: #94a3b8;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid transparent;
    transition: all 0.2s ease;
  }

  .thumb-pill.active {
    background: #0284c7;
    color: #ffffff;
    border-color: #38bdf8;
  }

  .thumb-pill:hover:not(.active) {
    background: #475569;
    color: #f8fafc;
  }

  /* Presenter Notes Modal / Bar */
  .notes-pane {
    background: #0f172a;
    color: #94a3b8;
    padding: 10px 24px;
    font-size: 12px;
    border-top: 1px solid #1e293b;
    display: none;
  }

  .notes-pane.show {
    display: block;
  }

  .notes-pane strong {
    color: #f59e0b;
  }

  /* Print Styles for PPT Deck */
  @media print {
    body {
      background: none !important;
      overflow: visible !important;
    }
    .pres-header, .pres-carousel-bar, .notes-pane {
      display: none !important;
    }
    .stage-container {
      padding: 0 !important;
      display: block !important;
    }
    .slide-viewport {
      box-shadow: none !important;
      border-radius: 0 !important;
      width: 100% !important;
      height: 100vh !important;
      page-break-after: always;
      page-break-inside: avoid;
    }
    .slide-wrapper {
      display: block !important;
      margin-bottom: 20px;
    }
  }
</style>
</head>

    let currentSlide = 1;
    const totalSlides = slidesData.length;

    function renderThumbnails() {
      const scroller = document.getElementById('thumbnailsScroller');
      scroller.innerHTML = '';
      slidesData.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.className = `thumb-pill ${s.id === currentSlide ? 'active' : ''}`;
        btn.innerText = `${s.id}. ${s.title.split(' ')[0]}`;
        btn.onclick = () => goToSlide(s.id);
        scroller.appendChild(btn);
      });
    }

    function renderSlide(index) {
      const slide = slidesData.find(s => s.id === index);
      if (!slide) return;
      
      const target = document.getElementById('slideTarget');
      target.innerHTML = slide.html;
      
      document.getElementById('slideCurrentNum').innerText = currentSlide;
      document.getElementById('slideTotalNum').innerText = totalSlides;
      document.getElementById('notesContent').innerText = slide.notes;

      document.getElementById('prevBtn').disabled = currentSlide === 1;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides;

      renderThumbnails();
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function goToSlide(num) {
      currentSlide = num;
      renderSlide(currentSlide);
    }

    function togglePresenterNotes() {
      const pane = document.getElementById('notesPane');
      pane.classList.toggle('show');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      } else if (e.key === 'n' || e.key === 'N') {
        togglePresenterNotes();
      }
    });

    // Initialize
    renderSlide(currentSlide);
  </script>
